<style>
/* Manager app: the same travel-brand look as the dashboard, built for one hand on a phone - big tap targets, one task per screen, a bottom tab bar. */
:root{--bg:#f6f8fc;--surface:#fff;--surface-2:#f2f5fb;--hair:#eef2f8;--hair-2:#dde4ef;--ink:#0c1a3d;--ink-2:#2f3d5e;--muted:#5a6681;--faint:#9aa4ba;
  --accent:#1d5bd8;--accent-soft:#eaf1ff;--ok:#0f8a5f;--warn:#b86e00;--bad:#c2372f;--shadow:0 10px 30px rgba(12,26,61,.08);
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--serif:'DM Serif Display',Georgia,serif}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--hair)}
.top .who{flex:1;display:grid;min-width:0}.top .who b{font-family:var(--serif);font-weight:400;font-size:20px;line-height:1.1}.top .who small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic{width:42px;height:42px;border-radius:50%;border:1px solid var(--hair-2);background:var(--surface);display:grid;place-items:center;position:relative;cursor:pointer}
.ic svg{width:19px;height:19px;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--bad);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;box-shadow:0 0 0 2px var(--bg)}
main{display:grid;gap:14px;padding:14px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));max-width:720px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--hair);border-radius:20px;padding:14px;box-shadow:var(--shadow);display:grid;gap:10px}
.card h2{margin:0;font-size:15px;display:flex;align-items:center;gap:8px}.card h2 small{margin-left:auto;color:var(--muted);font-weight:500;font-size:12px}
.hint{color:var(--muted);font-size:12.5px;margin:0}.empty{color:var(--muted);font-size:13px;padding:6px 0}
.row{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--hair)}.row:first-of-type{border-top:0}
.row .t{flex:1;display:grid;gap:2px;min-width:0}.row .t b{font-size:14px}.row .t span{color:var(--muted);font-size:12.5px}
.pill{display:inline-flex;align-items:center;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.p-ok{background:color-mix(in srgb,var(--ok) 14%,#fff);color:var(--ok)}.p-warn{background:color-mix(in srgb,var(--warn) 15%,#fff);color:var(--warn)}.p-bad{background:color-mix(in srgb,var(--bad) 12%,#fff);color:var(--bad)}.p-acc{background:var(--accent-soft);color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 16px;border-radius:14px;border:1px solid var(--hair-2);background:var(--surface);font-weight:650;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:12px}.btn.full{width:100%}.btn:disabled{opacity:.5}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:var(--surface-2);border-radius:14px;padding:10px;display:grid;gap:2px;text-align:center}
.stat b{font-size:18px}.stat span{font-size:11px;color:var(--muted)}.stat .ok{color:var(--ok)}.stat .bad{color:var(--bad)}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{display:inline-flex;gap:6px;align-items:center;padding:8px 12px;border-radius:99px;border:1px solid var(--hair-2);background:var(--surface);font-weight:600;font-size:13px;cursor:pointer}
.chip b{color:var(--bad)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));
  background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--hair)}
.tabs button{display:grid;justify-items:center;gap:2px;border:0;background:none;padding:6px 2px;font-size:10.5px;font-weight:650;color:var(--muted);cursor:pointer;position:relative}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.tabs button[aria-current=page]{color:var(--accent)}
.tabs .badge{top:0;right:calc(50% - 22px)}
.form{display:grid;gap:12px}.form label{display:grid;gap:5px;font-size:12.5px;font-weight:650;color:var(--ink-2)}
.form input,.form select,.form textarea{width:100%;min-height:44px;padding:10px 12px;border-radius:12px;border:1px solid var(--hair-2);background:var(--surface);font-size:15px}
.ck{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;border:1px solid var(--hair-2);background:var(--surface);cursor:pointer;font-size:14px;font-weight:500}
.ck input{width:22px;height:22px;accent-color:var(--accent);flex:none}.ck.on{border-color:color-mix(in srgb,var(--ok) 45%,var(--hair-2));background:color-mix(in srgb,var(--ok) 6%,#fff)}
.cnt{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--hair)}.cnt input{width:96px;text-align:center}
.yn{display:inline-flex;border:1px solid var(--hair-2);border-radius:12px;overflow:hidden}.yn button{border:0;background:var(--surface);padding:9px 14px;font-weight:650;cursor:pointer}.yn button[aria-pressed=true]{background:var(--accent);color:#fff}
.pics{display:flex;gap:8px;flex-wrap:wrap}.pics img{width:72px;height:72px;object-fit:cover;border-radius:12px;border:1px solid var(--hair-2)}
.addpic{width:72px;height:72px;border-radius:12px;border:1.5px dashed var(--hair-2);display:grid;place-items:center;color:var(--muted);font-size:24px;cursor:pointer;background:var(--surface)}
.err{color:var(--bad);font-size:13px;font-weight:600}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(12,26,61,.35);display:flex;align-items:flex-end;justify-content:center}
.sheet .in{width:100%;max-width:720px;max-height:92vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px}
.sheet h3{margin:0;font-family:var(--serif);font-weight:400;font-size:22px;display:flex;align-items:center;justify-content:space-between}
.sheet .x{border:0;background:var(--surface-2);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:#fff;padding:10px 16px;border-radius:99px;font-size:13px;font-weight:600;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.login{min-height:100vh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.login .card{width:100%;max-width:380px;padding:24px;gap:14px}.login h1{margin:0;font-family:var(--serif);font-weight:400;font-size:30px;line-height:1.1}.login h1 em{color:var(--accent)}
.news-c{display:grid;gap:4px;padding:10px 12px;border:1px solid var(--hair-2);border-radius:16px;background:var(--surface)}.news-c b{display:flex;gap:8px;align-items:center}.news-c b span{margin-left:auto;font-size:12px;color:var(--muted)}
.news-i{display:grid;gap:1px;padding:6px 0;border-top:1px solid var(--hair);font-size:12.5px}.news-i:first-of-type{border-top:0}.news-i small{color:var(--muted)}
.loading{display:grid;place-items:center;gap:10px;padding:40px 0;color:var(--muted)}.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--hair-2);border-top-color:var(--accent);animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.spin{animation:none}}
/* round 2: urgent card, outbox, ratings, check-in info, language */
.card.urgent{border-color:color-mix(in srgb,var(--bad) 45%,var(--hair));background:color-mix(in srgb,var(--bad) 4%,#fff)}.card.urgent h2 svg{width:18px;height:18px;fill:none;stroke:var(--bad);stroke-width:2}
.badge.warn{background:var(--warn)}.row .acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.info{margin:0 0 6px;padding:8px 12px;border-radius:12px;background:var(--surface-2);font-size:12.5px}.info summary{cursor:pointer;font-weight:650;color:var(--accent)}.info p{margin:6px 0 0}
.stars{display:flex;gap:6px}.stars button{border:0;background:none;font-size:36px;line-height:1;color:var(--hair-2);cursor:pointer;padding:2px}.stars button[aria-pressed=true]{color:#f5a623}
.stats.two{grid-template-columns:repeat(2,1fr)}.cnt span small{display:block;color:var(--muted);font-size:11.5px;font-weight:500}.cnt .lowm{color:var(--warn);font-weight:650}
.lang{display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}button.pill{border:0;cursor:pointer}
</style>

<body>
<div id="app"></div>
<script>
const CLIENT={"brand":"Jabula Getaways","api_url":"https://script.google.com/macros/s/AKfycbx4XDMPpi09WM91pvbvFWVcsW4jF4kpwyafG59BSlP5fLT0h4kETheXehJk6J9eMpCncQ/exec","logo":{"dark":"brand/wordmark-dark-web.png","light":"brand/wordmark-light-web.png"},"ops_start":"2026-10-27","app":{"app_name":"Jabula Getaways","short_name":"Jabula","description":"Bookings, money, check-in desk and WhatsApp leads in one place.","background":"#f6f8fc","theme":"#f6f8fc","icon_color":"#686762"}};
/* Shared by the dashboard and the manager app (build.py puts it in both): what is due, done or missed for checkout
   checklists, stock checks and guest reviews; manager scorecards; and "what's new since you last looked" from outside
   sources (the WhatsApp bot, manager apps). Pure functions over the register rows - no screen code here. */
const OPS=(()=>{
  const iso=d=>d.toISOString().slice(0,10);
  const addD=(s,n)=>{const d=new Date(String(s).slice(0,10)+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return iso(d)};
  const dayDiff=(a,b)=>Math.round((new Date(String(b).slice(0,10)+'T12:00:00Z')-new Date(String(a).slice(0,10)+'T12:00:00Z'))/864e5);
  const list=v=>Array.isArray(v)?v:typeof v==='string'&&v.trim().startsWith('[')?(()=>{try{return JSON.parse(v)}catch(e){return[]}})():String(v||'').split(',').map(x=>x.trim()).filter(Boolean);
  const js=v=>{if(v&&typeof v==='object')return v;try{return v?JSON.parse(v):null}catch(e){return null}};
  const DEF_CHECK=['Linen changed and beds made','Bathrooms cleaned','Kitchen and dishes clean','Floors swept and mopped','Bins emptied',
    'Fresh towels out','Toiletries refilled','AC, fans and lights off','Doors and windows locked','Damage or missing items checked'];
  const DEF_STOCK=[{name:'Bedsheets'},{name:'Pillow covers'},{name:'Towels'},{name:'Toiletry kits'},{name:'Toilet rolls'},
    {name:'TV working',type:'ok'},{name:'Wi-Fi working',type:'ok'},{name:'Geyser working',type:'ok'},{name:'First-aid kit',type:'ok'}];
  /* settings: Settings rows ops.* / reviews.* over the client's defaults */
  function cfg(rows,client){const m={};(rows||[]).forEach(r=>{m[String(r.key)]=r.value});client=client||{};
    const num=(k,d)=>{const v=+m[k];return isFinite(v)&&m[k]!==''&&m[k]!=null?v:d};
    const items=k=>{const v=js(m[k]);return Array.isArray(v)&&v.length?v:null};
    const si=js(m['ops.stay_items']);
    return{start:String(m['ops.start_date']||client.ops_start||'2026-10-27').slice(0,10),grace:num('ops.checklist_grace_days',1),
      every:num('ops.stock_every_days',14),checkItems:items('ops.checkout_items')||DEF_CHECK,stockItems:items('ops.stock_items')||DEF_STOCK,
      stayItems:si&&typeof si==='object'&&!Array.isArray(si)?si:{},photoSlots:items('ops.photo_slots')||[],
      checkinTime:String(m['ops.checkin_time']||client.check_in_time||'13:00'),twoAdmin:num('ops.claim_two_admin_above',5000),
      cities:(()=>{const v=js(m['ops.cities']);return Array.isArray(v)?v.filter(x=>x&&x.name):[]})(),
      channels:list(m['reviews.channels']||'Airbnb'),window:num('reviews.window_days',14),lowAt:num('reviews.low_at',3)}}
  /* the common list plus what this stay (or the whole place it belongs to) adds */
  const parentOf=(pid,props)=>((props||[]).find(p=>list(p.includes).includes(pid))||{}).property_id||null;
  const extra=(c,pid,props,k)=>[...((c.stayItems[parentOf(pid,props)]||{})[k]||[]),...((c.stayItems[pid]||{})[k]||[])];
  function checkItemsFor(c,pid,props){return[...new Set([...c.checkItems,...extra(c,pid,props,'check')])]}
  function stockItemsFor(c,pid,props){const out=c.stockItems.slice();extra(c,pid,props,'stock').forEach(x=>{const it=typeof x==='string'?parseItem(x):x;if(!out.some(o=>o.name===it.name))out.push(it)});return out}
  /* "Bedsheets (min 12)" / "TV working (ok)" -> {name, min} / {name, type:'ok'} */
  function parseItem(x){x=String(x).trim();if(/\(ok\)$/i.test(x))return{name:x.replace(/\s*\(ok\)$/i,''),type:'ok'};const m=/^(.*?)\s*\(min\s*(\d+)\)$/i.exec(x);return m?{name:m[1],min:+m[2]}:{name:x}}
  const itemText=it=>it.name+(it.type==='ok'?' (ok)':it.min?` (min ${it.min})`:'');
  /* two stays share nights when they are the same place, or one is the whole place over the other */
  const overlap=(a,b,props)=>a===b||parentOf(a,props)===b||parentOf(b,props)===a; /* two flats of one place are separate */
  const live=b=>b&&!b.deleted_at&&String(b.booking_status||'Confirmed')!=='Cancelled'&&b.check_in&&b.check_out;
  /* a manager's stays: their list plus the whole place over their flats and the flats of a whole place they manage */
  function scope(ids,props){ids=list(ids);const set=new Set(ids);(props||[]).forEach(p=>{const inc=list(p.includes);
    if(inc.some(k=>set.has(k)))set.add(p.property_id);if(ids.includes(p.property_id))inc.forEach(k=>set.add(k))});return set}
  /* checkout checklists: one per stay that ended since the start date */
  /* a same-day turnover (the next guest checks in the day this one leaves) must be ready by check-in time: urgent */
  function checklists(bookings,rows,today,c,inScope,props){const byB={};(rows||[]).forEach(r=>{if(r.booking_id)byB[String(r.booking_id)]=r});
    const L=(bookings||[]).filter(live);
    return L.filter(b=>String(b.check_out).slice(0,10)>=c.start&&String(b.check_out).slice(0,10)<=today&&(!inScope||inScope(b.property_id)))
      .map(b=>{const co=String(b.check_out).slice(0,10),r=byB[String(b.booking_id)],due=addD(co,c.grace);
        const next=L.find(x=>x!==b&&String(x.check_in).slice(0,10)===co&&overlap(x.property_id,b.property_id,props));
        return{booking:b,property_id:b.property_id,check_out:co,due,row:r||null,status:r?'done':today>due?'missed':'due',missedAt:r?null:due,
          sameDay:!!next,next:next||null,urgent:!!next&&!r&&co===today,dueTime:next?String(next.arrival_time||c.checkinTime||'13:00').slice(0,5):null}})
      .sort((a,b)=>(b.urgent-a.urgent)||b.check_out.localeCompare(a.check_out))}
  /* stock checks: every N days per real place (a whole place is its flats) */
  function stock(props,rows,today,c,inScope){const out=[];
    (props||[]).filter(p=>!list(p.includes).length&&!/^(stopped|inactive)$/i.test(String(p.status||''))&&(!inScope||inScope(p.property_id))).forEach(p=>{
      const mine=(rows||[]).filter(r=>r.property_id===p.property_id).map(r=>({...r,day:String(r.done_at||r.submitted_at||'').slice(0,10)})).filter(r=>r.day);
      let a=c.start,done=0,missed=0,missedAt=[],cur=null;
      for(let i=0;i<200&&a<=today;i++){const z=addD(a,c.every),hit=mine.find(r=>r.day>=a&&r.day<z);
        if(z>today){cur={from:a,until:addD(z,-1),status:hit?'done':'due',row:hit||null};break}
        if(hit)done++;else{missed++;missedAt.push(z)}a=z}
      const last=mine.sort((x,y)=>y.day.localeCompare(x.day))[0]||null;
      out.push({property_id:p.property_id,current:cur,done,missed,missedAt,last})});return out}
  /* the last n counts for a place, newest first: [{day, counts, by}] */
  function stockTrend(rows,pid,n){return(rows||[]).filter(r=>r.property_id===pid).map(r=>({day:String(r.done_at||r.submitted_at||'').slice(0,10),counts:js(r.counts)||{},by:r.by_name||r.by||''}))
    .filter(r=>r.day).sort((a,b)=>b.day.localeCompare(a.day)).slice(0,n||4)}
  /* below the minimum at the latest count, per place: what to buy */
  function shopping(props,rows,c){const out=[];(props||[]).filter(p=>!list(p.includes).length&&!/^(stopped|inactive)$/i.test(String(p.status||''))).forEach(p=>{
    const last=stockTrend(rows,p.property_id,1)[0];if(!last)return;stockItemsFor(c,p.property_id,props).filter(it=>it.min&&it.type!=='ok').forEach(it=>{const have=+last.counts[it.name];
      if(isFinite(have)&&have<it.min)out.push({property_id:p.property_id,city:p.city||'',item:it.name,have,min:it.min,need:it.min-have,day:last.day})})});return out}
  /* guest reviews: platform stays (Airbnb by default) have a window after check-out to be reviewed */
  function reviews(bookings,rows,today,c,inScope){const byB={};(rows||[]).forEach(r=>{if(r.booking_id)byB[String(r.booking_id)]=r});
    return(bookings||[]).filter(b=>live(b)&&c.channels.includes(String(b.channel))&&String(b.check_out).slice(0,10)>=c.start&&String(b.check_out).slice(0,10)<=today&&(!inScope||inScope(b.property_id)))
      .map(b=>{const co=String(b.check_out).slice(0,10),r=byB[String(b.booking_id)]||null,end=addD(co,c.window),left=dayDiff(today,end),st=String(r&&r.status||'');
        const status=st==='received'?'received':st==='missed'||(left<0&&st!=='received')?'missed':st==='asked'?'asked':'open';
        return{booking:b,property_id:b.property_id,check_out:co,ends:end,left,row:r,status,missedAt:status==='missed'?(r&&r.decided_at)||end:null}})
      .sort((a,b)=>a.ends.localeCompare(b.ends))}
  /* who a manager is in the rows the server writes: their email, else login:<id> */
  const idOf=u=>String(u.email||(u.login?'login:'+u.login:'')).toLowerCase();
  /* per manager: work done is credited to whoever did it (even at a stay they no longer have); missed and due follow
     the stays they have now. Rows from before credit was recorded fall back to the name. */
  function scorecards(staff,data,today,c){return(staff||[]).filter(u=>String(u.role||'').toLowerCase()==='manager').map(u=>{
    const set=scope(u.properties,data.props),inS=pid=>set.has(pid),me=idOf(u),nm=String(u.name||'').trim().toLowerCase();
    const mine=(r,idk,nk)=>{const id=String(r[idk]||'').toLowerCase();return id?id===me:!!nm&&String(r[nk]||'').trim().toLowerCase()===nm};
    const cl=checklists(data.bookings,data.checklists,today,c,inS,data.props),rv=reviews(data.bookings,data.reviews,today,c,inS),sk=stock(data.props,data.stock,today,c,inS);
    const cnt=(a,s)=>a.filter(x=>x.status===s).length,start=r=>String(r.done_at||r.submitted_at||r.asked_at||'').slice(0,10)>=c.start;
    const got=(data.reviews||[]).filter(r=>r.status==='received'&&mine(r,'asked_by_id','asked_by')),rated=got.filter(r=>+r.rating>0);
    return{user:u,stays:[...set],reviews:{received:got.length,missed:cnt(rv,'missed'),asked:cnt(rv,'asked'),open:cnt(rv,'open'),
        avg:rated.length?Math.round(rated.reduce((t,r)=>t+ +r.rating,0)/rated.length*10)/10:null,low:got.filter(r=>r.low==='Yes').length},
