<style>
/* Manager app: the same travel-brand look as the dashboard, built for one hand on a phone - big tap targets, one task per screen, a bottom tab bar. */
:root{--bg:#f6f8fc;--surface:#fff;--surface-2:#f2f5fb;--hair:#eef2f8;--hair-2:#dde4ef;--ink:#0c1a3d;--ink-2:#2f3d5e;--muted:#5a6681;--faint:#9aa4ba;
  --accent:#1d5bd8;--accent-soft:#eaf1ff;--ok:#0f8a5f;--warn:#b86e00;--bad:#c2372f;--shadow:0 10px 30px rgba(12,26,61,.08);
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--serif:'DM Serif Display',Georgia,serif}
*{box-sizing:border-box}html,body{margin:0}html{-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-tap-highlight-color:transparent;color-scheme:light only;touch-action:pan-x pan-y}.sheet{overscroll-behavior:contain}body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  background:rgba(246,248,252,0.86);background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--hair)}
.top .who{flex:1;display:grid;min-width:0}.top .who b{font-family:var(--serif);font-weight:400;font-size:20px;line-height:1.1}.top .who small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic{width:42px;height:42px;border-radius:50%;border:1px solid var(--hair-2);background:var(--surface);display:grid;place-items:center;position:relative;cursor:pointer}
.ic svg{width:19px;height:19px;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--bad);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;box-shadow:0 0 0 2px var(--bg)}
main{display:grid;gap:14px;padding:14px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));max-width:720px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--hair);border-radius:20px;padding:14px;box-shadow:var(--shadow);display:grid;gap:10px}
.card h2{margin:0;font-size:15px;display:flex;align-items:center;gap:8px}.card h2 small{margin-left:auto;color:var(--muted);font-weight:500;font-size:12px}
.hint{color:var(--muted);font-size:12.5px;margin:0}.empty{color:var(--muted);font-size:13px;padding:6px 0}
.row{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--hair)}.row:first-of-type{border-top:0}
.row .t{flex:1;display:grid;gap:2px;min-width:0}.row .t b{font-size:14px}.row .t span{color:var(--muted);font-size:12.5px}
.pill{display:inline-flex;align-items:center;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.p-ok{background:rgba(221,239,233,1.0);background:color-mix(in srgb,var(--ok) 14%,#fff);color:var(--ok)}.p-warn{background:rgba(244,233,217,1.0);background:color-mix(in srgb,var(--warn) 15%,#fff);color:var(--warn)}.p-bad{background:rgba(248,231,230,1.0);background:color-mix(in srgb,var(--bad) 12%,#fff);color:var(--bad)}.p-acc{background:var(--accent-soft);color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 16px;border-radius:14px;border:1px solid var(--hair-2);background:var(--surface);font-weight:650;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:12px}.btn.full{width:100%}.btn:disabled{opacity:.5}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:var(--surface-2);border-radius:14px;padding:10px;display:grid;gap:2px;text-align:center}
.stat b{font-size:18px}.stat span{font-size:11px;color:var(--muted)}.stat .ok{color:var(--ok)}.stat .bad{color:var(--bad)}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{display:inline-flex;gap:6px;align-items:center;padding:8px 12px;border-radius:99px;border:1px solid var(--hair-2);background:var(--surface);font-weight:600;font-size:13px;cursor:pointer}
.chip b{color:var(--bad)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));
  background:rgba(255,255,255,0.92);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--hair)}
.tabs button{display:grid;justify-items:center;gap:2px;border:0;background:none;padding:6px 2px;font-size:10.5px;font-weight:650;color:var(--muted);cursor:pointer;position:relative}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.tabs button[aria-current=page]{color:var(--accent)}
.tabs .badge{top:0;right:calc(50% - 22px)}.tabs button{position:relative;min-width:0}.tabs .badge{max-width:calc(50% + 18px)}html.locked,html.locked body{overflow:hidden;overscroll-behavior:none}.t,.t b,.t span,.card h2,.hint,.sheet h3{overflow-wrap:anywhere;min-width:0}button[aria-pressed]>.badge{position:static;display:inline-grid;margin-left:6px;vertical-align:1px}
.form{display:grid;gap:12px}.form label{display:grid;gap:5px;font-size:12.5px;font-weight:650;color:var(--ink-2)}
.form input,.form select,.form textarea{width:100%;min-height:44px;padding:10px 12px;border-radius:12px;border:1px solid var(--hair-2);background:var(--surface);font-size:15px}
.ck{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;border:1px solid var(--hair-2);background:var(--surface);cursor:pointer;font-size:14px;font-weight:500}
.ck input{width:22px;height:22px;accent-color:var(--accent);flex:none}.ck.on{border-color:rgba(128,188,174,1.0);border-color:color-mix(in srgb,var(--ok) 45%,var(--hair-2));background:rgba(241,248,245,1.0);background:color-mix(in srgb,var(--ok) 6%,#fff)}
.cnt{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--hair)}.cnt input{width:96px;text-align:center}
.yn{display:inline-flex;border:1px solid var(--hair-2);border-radius:12px;overflow:hidden}.yn button{border:0;background:var(--surface);padding:9px 14px;font-weight:650;cursor:pointer}.yn button[aria-pressed=true]{background:var(--accent);color:#fff}
.pics{display:flex;gap:8px;flex-wrap:wrap}.pics img{width:72px;height:72px;object-fit:cover;border-radius:12px;border:1px solid var(--hair-2)}
.addpic{width:72px;height:72px;border-radius:12px;border:1.5px dashed var(--hair-2);display:grid;place-items:center;color:var(--muted);font-size:24px;cursor:pointer;background:var(--surface)}
.err{color:var(--bad);font-size:13px;font-weight:600}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(12,26,61,.35);display:flex;align-items:flex-end;justify-content:center}
.sheet .in{width:100%;max-width:720px;max-height:92vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px}
.sheet h3{margin:0;font-family:var(--serif);font-weight:400;font-size:22px;display:flex;align-items:center;justify-content:space-between}
.sheet .x{border:0;background:var(--surface-2);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:#fff;padding:10px 16px;border-radius:99px;font-size:13px;font-weight:600;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.login{min-height:100vh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.login .card{width:100%;max-width:380px;padding:24px;gap:14px}.login h1{margin:0;font-family:var(--serif);font-weight:400;font-size:30px;line-height:1.1}.login h1 em{color:var(--accent)}
.news-c{display:grid;gap:4px;padding:10px 12px;border:1px solid var(--hair-2);border-radius:16px;background:var(--surface)}.news-c b{display:flex;gap:8px;align-items:center}.news-c b span{margin-left:auto;font-size:12px;color:var(--muted)}
.news-i{display:grid;gap:1px;padding:6px 0;border-top:1px solid var(--hair);font-size:12.5px}.news-i:first-of-type{border-top:0}.news-i small{color:var(--muted)}
.loading{display:grid;place-items:center;gap:10px;padding:40px 0;color:var(--muted)}.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--hair-2);border-top-color:var(--accent);animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.spin{animation:none}}
/* round 2: urgent card, outbox, ratings, check-in info, language */
.card.urgent{border-color:rgba(218,158,158,1.0);border-color:color-mix(in srgb,var(--bad) 45%,var(--hair));background:rgba(253,247,247,1.0);background:color-mix(in srgb,var(--bad) 4%,#fff)}.card.urgent h2 svg{width:18px;height:18px;fill:none;stroke:var(--bad);stroke-width:2}
.badge.warn{background:var(--warn)}
/* checklist / stock: one card per item */
.prog{display:grid;gap:5px}.prog-b{height:8px;border-radius:99px;background:var(--hair-2);overflow:hidden}.prog-b i{display:block;height:100%;width:0;border-radius:99px;background:var(--ok);transition:width .25s}
.prog small{color:var(--muted);font-size:12px;font-weight:600}
.ci-list{display:grid;gap:8px}
.ci{display:grid;gap:8px;padding:10px 12px;border-radius:16px;border:1px solid var(--hair-2);background:var(--surface);transition:border-color .2s,background .2s}
.ci.on{border-color:rgba(128,188,174,1.0);border-color:color-mix(in srgb,var(--ok) 45%,var(--hair-2));background:rgba(241,248,245,1.0);background:color-mix(in srgb,var(--ok) 6%,#fff)}
.ci.bad{border-color:rgba(201,163,108,1.0);border-color:color-mix(in srgb,var(--warn) 55%,var(--hair-2));background:rgba(250,245,237,1.0);background:color-mix(in srgb,var(--warn) 7%,#fff)}
.ci.need{box-shadow:inset 3px 0 0 var(--warn)}
.ci-top{display:flex;align-items:center;gap:12px}.ci-t{flex:1;min-width:0;display:grid;gap:1px}.ci-t b{font-size:14.5px;font-weight:600;line-height:1.3}
.ci-t small{color:var(--muted);font-size:11.5px}.ci-t .ci-req{color:var(--warn);font-weight:650}
.ci.count .ci-top,.ci.yesno .ci-top{flex-wrap:wrap}.ci.count .ci-t,.ci.yesno .ci-t{order:-1;flex-basis:calc(100% - 100px)}
.ci-acts{display:flex;gap:6px;flex:none}
.ci-b{position:relative;width:40px;height:40px;border-radius:12px;border:1px solid var(--hair-2);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.ci-b svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.ci-b.has{color:var(--accent);border-color:var(--accent)}.ci-b b{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 4px}
.ci.need .ci-b:first-of-type+.ci-b{border-color:var(--warn);color:var(--warn)}
.tk{width:44px;height:44px;flex:none;border-radius:50%;border:2px solid var(--hair-2);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:transparent;transition:all .15s}
.tk svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.tk[aria-pressed=true]{background:var(--ok);border-color:var(--ok);color:#fff}
.stp{display:inline-flex;align-items:center;border:1px solid var(--hair-2);border-radius:14px;overflow:hidden;background:var(--surface)}
.stp button{width:44px;height:44px;border:0;background:var(--surface-2);font-size:22px;font-weight:600;cursor:pointer;color:var(--ink)}
.stp input{width:58px;height:44px;border:0;text-align:center;font-size:17px;font-weight:650;padding:0;-moz-appearance:textfield;background:transparent}
.stp input::-webkit-inner-spin-button{-webkit-appearance:none}
.ci .yn button{min-height:44px;min-width:58px}
.ci-note{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--hair-2);font:inherit;font-size:14px}
.ci-pics{display:flex;gap:6px;flex-wrap:wrap}.ci-pics:empty{display:none}
.ci-th{position:relative}.ci-th img{width:60px;height:60px;object-fit:cover;border-radius:10px;border:1px solid var(--hair-2);display:block}
.ci-th button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:13px;line-height:1;cursor:pointer}
h4.sub{margin:6px 0 0;font-size:14px}.card.tasks{border-color:rgba(165,189,237,1.0);border-color:color-mix(in srgb,var(--accent) 35%,var(--hair))}.card.tasks .t span{white-space:normal;overflow:visible}.card.tasks h2 svg{width:18px;height:18px;fill:none;stroke:var(--accent);stroke-width:2}.row .acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.draft{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 12px;border-radius:14px;background:rgba(235,240,251,1.0);background:color-mix(in srgb,var(--accent) 9%,var(--surface));border:1px solid rgba(29,91,216,0.22);border:1px solid color-mix(in srgb,var(--accent) 22%,transparent);margin:0 0 10px}.draft .t{display:grid;gap:2px;flex:1 1 180px}.draft .t span{font-size:12px;color:var(--muted)}.draft .acts{display:flex;gap:8px}
details.missed>summary{cursor:pointer;font-size:15px;font-weight:650;color:var(--muted);list-style:none;display:flex;align-items:center;gap:6px;min-height:28px}details.missed>summary::-webkit-details-marker{display:none}details.missed>summary::before{content:'›';display:inline-block;transition:transform .2s}details.missed[open]>summary::before{transform:rotate(90deg)}
.info{margin:0 0 6px;padding:8px 12px;border-radius:12px;background:var(--surface-2);font-size:12.5px}.info summary{cursor:pointer;font-weight:650;color:var(--accent)}.info p{margin:6px 0 0}
.stars{display:flex;gap:6px}.stars button{border:0;background:none;font-size:36px;line-height:1;color:var(--hair-2);cursor:pointer;padding:2px}.stars button[aria-pressed=true]{color:#f5a623}
.stats.two{grid-template-columns:repeat(2,1fr)}.cnt span small{display:block;color:var(--muted);font-size:11.5px;font-weight:500}.cnt .lowm{color:var(--warn);font-weight:650}
.lang{display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}button.pill{border:0;cursor:pointer}

/* photo viewer */
html.iv-open,html.iv-open body{overflow:hidden}
.iv{position:fixed;inset:0;z-index:200;background:rgba(6,8,14,.96);display:flex;flex-direction:column;touch-action:none;color:#fff;animation:ivIn .18s ease-out}
@keyframes ivIn{from{opacity:0}to{opacity:1}}
.iv-top{display:flex;align-items:center;gap:10px;padding:max(10px,env(safe-area-inset-top,0px)) 12px 10px;font-size:13px}
.iv-n{font-variant-numeric:tabular-nums;opacity:.8;min-width:42px}.iv-cap{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.9}
.iv-acts{display:flex;gap:6px}.iv-b{border:0;border-radius:99px;background:rgba(255,255,255,.14);color:#fff;font:inherit;font-size:13px;font-weight:600;padding:8px 12px;cursor:pointer;min-height:36px}
.iv-stage{flex:1;min-height:0;display:grid;place-items:center;overflow:hidden;padding:0 0 max(10px,env(safe-area-inset-bottom,0px))}
.iv-img{max-width:100%;max-height:100%;object-fit:contain;transform-origin:center;transition:transform .08s linear;user-select:none;-webkit-user-drag:none}
.iv-prev,.iv-next{position:absolute;top:50%;margin-top:-22px;width:44px;height:44px;border-radius:50%;font-size:26px;line-height:1;padding:0}
.iv-prev{left:10px}.iv-next{right:10px}.iv-prev[hidden],.iv-next[hidden]{display:none}
@media (pointer:coarse){.iv-prev,.iv-next{display:none}}
.cv-tag{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;font-size:10.5px;font-weight:700;letter-spacing:.02em;background:#fff3d6;color:#8a5a00;vertical-align:1px}
.cv-note{display:flex;flex-direction:column;gap:2px;border-left:4px solid #e0a020}.cv-note.on{border-left-color:#1d5bd8}.cv-note span{font-size:13px;color:#5a6681}
.lv-list{margin-top:14px}
input:not([type=checkbox]):not([type=radio]):not([type=range]),select,textarea{font-size:16px!important}   /* 16 px everywhere: iPhone never zooms into a field */
@supports not (color:color-mix(in srgb,red,blue)){.p-ok{background:#e3f5eb}.p-warn{background:#fff1de}.p-bad{background:#fdecea}}   /* iOS < 16.2 */

/* Stays tab, house info, guest contact (v1.64) */
.st-card{gap:12px;padding:16px}.st-h{display:flex;gap:12px;align-items:center;border:0;background:none;font:inherit;color:inherit;text-align:left;padding:0;cursor:pointer;width:100%}
.st-av{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none;color:#fff;font-weight:700;font-size:14px;background:linear-gradient(140deg,rgba(97,140,228,1.0),var(--accent));background:linear-gradient(140deg,color-mix(in srgb,var(--accent) 70%,#fff),var(--accent))}
.st-h .t{flex:1;display:grid;gap:2px;min-width:0}.st-h .t b{font-size:15px}.st-h .t span{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-acts{display:flex;gap:8px;flex-wrap:wrap}.st-acts .btn svg,.ic-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2}
.dir{display:grid;border-radius:14px;background:var(--surface-2);overflow:hidden}.dir-r{display:flex;gap:10px;align-items:center;padding:10px 12px}.dir-r+.dir-r{border-top:1px solid var(--hair)}
.dir-r .t{flex:1;display:grid;gap:1px;min-width:0}.dir-r .t b{font-size:14px}.dir-r .t span{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ic-btn{width:38px;height:38px;padding:0!important;display:inline-grid!important;place-items:center;border-radius:12px!important}.ic-btn.wa{color:#128c4b}
.hi-card{display:grid;border-radius:16px;background:var(--surface-2);overflow:hidden}.hi-r{display:grid;gap:2px;padding:10px 14px}.hi-r+.hi-r{border-top:1px solid var(--hair)}.hi-r span{font-size:12px;color:var(--muted)}.hi-r b{font-size:14px;white-space:pre-wrap;word-break:break-word}
.acts.stack{display:grid;gap:8px;margin-top:12px}.acts.stack .btn{display:flex;gap:8px;align-items:center;justify-content:center}.acts.stack svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2}
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--surface-2)}.seg button{flex:1;border:0;border-radius:11px;padding:9px 10px;font:inherit;font-weight:600;font-size:13.5px;background:none;color:var(--muted);display:flex;gap:6px;justify-content:center;align-items:center}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(12,26,61,.12)}

<body>
<div id="app"></div>
<script>
const CLIENT={"brand":"Jabula Getaways","api_url":"https://script.google.com/macros/s/AKfycbx4XDMPpi09WM91pvbvFWVcsW4jF4kpwyafG59BSlP5fLT0h4kETheXehJk6J9eMpCncQ/exec","logo":{"dark":"brand/wordmark-dark-web.png","light":"brand/wordmark-light-web.png"},"ops_start":"2026-10-27","app":{"app_name":"Jabula Getaways","short_name":"Jabula","description":"Bookings, money, check-in desk and WhatsApp leads in one place.","background":"#f6f8fc","theme":"#f6f8fc","icon_color":"#686762"}};
/* Shared by the dashboard and the manager app (build.py puts it in both): what is due, done or missed for checkout
   checklists, stock checks and guest reviews; manager scorecards; and "what's new since you last looked" from outside
   sources (the WhatsApp bot, manager apps). Pure functions over the register rows - no screen code here. */
const OPS=(()=>{
  const iso=d=>d.toISOString().slice(0,10);
  const addD=(s,n)=>{const d=new Date(String(s).slice(0,10)+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return iso(d)};
  const dayDiff=(a,b)=>Math.round((new Date(String(b).slice(0,10)+'T12:00:00Z')-new Date(String(a).slice(0,10)+'T12:00:00Z'))/864e5);
  const list=v=>Array.isArray(v)?v:typeof v==='string'&&v.trim().startsWith('[')?(()=>{try{return JSON.parse(v)}catch(e){return[]}})():String(v||'').split(',').map(x=>x.trim()).filter(Boolean);
  const js=v=>{if(v&&typeof v==='object')return v;try{return v?JSON.parse(v):null}catch(e){return null}};
  const DEF_CHECK=['Linen changed and beds made','Bathrooms cleaned','Kitchen and dishes clean','Floors swept and mopped','Bins emptied',
    'Fresh towels out','Toiletries refilled','AC, fans and lights off','Doors and windows locked','Damage or missing items checked'];
  const DEF_STOCK=[{name:'Bedsheets'},{name:'Pillow covers'},{name:'Towels'},{name:'Toiletry kits'},{name:'Toilet rolls'},
    {name:'TV working',type:'ok'},{name:'Wi-Fi working',type:'ok'},{name:'Geyser working',type:'ok'},{name:'First-aid kit',type:'ok'}];
  /* suggestions shown unticked in Manager app setup (the admin ticks what applies, or adds their own) */
  const PRESET_CHECK=[...DEF_CHECK,'Fridge emptied and wiped','Geyser and heaters off','Gas knob closed','Keys and remotes in place','Bin liners replaced',
    'Mirrors and glass wiped','Balcony swept','Water bottles refilled','Mattress and pillows checked for stains'];
  const PRESET_STOCK=[...DEF_STOCK,{name:'Hand wash'},{name:'Dishwash liquid'},{name:'Garbage bags'},{name:'Drinking water bottles'},{name:'Tea and coffee kits'},
    {name:'Spare gas cylinder full',type:'ok'},{name:'Inverter working',type:'ok'},{name:'AC remote working',type:'ok'},{name:'Iron working',type:'ok'},{name:'Hair dryer working',type:'ok'}];
  const DEF_REQ=['Extra towels','Extra blankets','Room cleaning','Drinking water','Toiletries refill','Gas cylinder','Extra mattress'];
  const PRESET_REQ=[...DEF_REQ,'Extra pillows','Iron','Hair dryer','Room heater','Kettle','Hot water bottle','Firewood'];
  /* an item: {name, type, expect|min, photo, off}. Checklist type tick|count (expect = the number there should be);
     stock type count|ok (min = buy more below it). Old lists of plain text still work. */
  const normCheck=x=>typeof x==='string'?{name:x.trim(),type:'tick'}:{...x,name:String((x&&x.name)||'').trim(),type:x&&x.type==='count'?'count':'tick'};
  const normStock=x=>typeof x==='string'?parseItem(x):{...x,name:String((x&&x.name)||'').trim()};
  const normReq=x=>typeof x==='string'?{name:x.trim()}:{...x,name:String((x&&x.name)||'').trim()};
  const active=(arr,norm)=>{const out=[];arr.map(norm).forEach(it=>{if(it.name&&!it.off&&!out.some(o=>o.name===it.name))out.push(it)});return out};
  /* is a checklist item done: ticked, or counted (and at least the expected number when one is set) */
  const checkDone=(it,v)=>it.type==='count'?v!=null&&v!==''&&!isNaN(+v)&&(!it.expect||+v>=it.expect):v===true;
  /* settings: Settings rows ops.* / reviews.* over the client's defaults */
  function cfg(rows,client){const m={};(rows||[]).forEach(r=>{m[String(r.key)]=r.value});client=client||{};
    const num=(k,d)=>{const v=+m[k];return isFinite(v)&&m[k]!==''&&m[k]!=null?v:d};
    const items=k=>{const v=js(m[k]);return Array.isArray(v)&&v.length?v:null};
    const si=js(m['ops.stay_items']);
    return{start:String(m['ops.start_date']||client.ops_start||'2026-10-27').slice(0,10),grace:num('ops.checklist_grace_days',1),
      every:num('ops.stock_every_days',14),checkItems:items('ops.checkout_items')||DEF_CHECK,stockItems:items('ops.stock_items')||DEF_STOCK,
      stayItems:si&&typeof si==='object'&&!Array.isArray(si)?si:{},photoSlots:items('ops.photo_slots')||[],
      reqItems:items('ops.guest_requests')||DEF_REQ,reqOpenMax:num('ops.guest_request_open_max',3),
      checkinTime:String(m['ops.checkin_time']||client.check_in_time||'13:00'),checkoutTime:String(m['ops.checkout_time']||client.check_out_time||'11:00'),twoAdmin:num('ops.claim_two_admin_above',5000),
      cities:(()=>{const v=js(m['ops.cities']);return Array.isArray(v)?v.filter(x=>x&&x.name):[]})(),
      channels:list(m['reviews.channels']||'Airbnb'),window:num('reviews.window_days',14),lowAt:num('reviews.low_at',3)}}
  /* the common list plus what this stay (or the whole place it belongs to) adds */
  const parentOf=(pid,props)=>((props||[]).find(p=>list(p.includes).includes(pid))||{}).property_id||null;
  const extra=(c,pid,props,k)=>[...((c.stayItems[parentOf(pid,props)]||{})[k]||[]),...((c.stayItems[pid]||{})[k]||[])];
  /* per-stay tuning (and its whole place's): off = template items this stay doesn't use; set = its own count / minimum
     for an item ({name: {expect} | {min}}, by lower-case name). Stored in ops.stay_items next to its own items. */
  const tune=(c,pid,props,k,items)=>{const fam=[parentOf(pid,props),pid].filter(Boolean).map(x=>c.stayItems[x]||{});
    const off=new Set(fam.flatMap(s=>((s.off||{})[k]||[]).map(n=>String(n).toLowerCase()))),set=Object.assign({},...fam.map(s=>(s.set||{})[k]||{}));
    return items.filter(it=>!off.has(it.name.toLowerCase())).map(it=>{const o=set[it.name.toLowerCase()];return o?{...it,...o}:it})};
  function checkItemsFor(c,pid,props){return tune(c,pid,props,'check',active([...c.checkItems,...extra(c,pid,props,'check')],normCheck))}
  function stockItemsFor(c,pid,props){return tune(c,pid,props,'stock',active([...c.stockItems,...extra(c,pid,props,'stock')],normStock))}
  /* "Bedsheets (min 12)" / "TV working (ok)" -> {name, min} / {name, type:'ok'} */
  function parseItem(x){x=String(x).trim();if(/\(ok\)$/i.test(x))return{name:x.replace(/\s*\(ok\)$/i,''),type:'ok'};const m=/^(.*?)\s*\(min\s*(\d+)\)$/i.exec(x);return m?{name:m[1],min:+m[2]}:{name:x}}
  const itemText=it=>it.name+(it.type==='ok'?' (ok)':it.min?` (min ${it.min})`:'');
  /* two stays share nights when they are the same place, or one is the whole place over the other */
  const overlap=(a,b,props)=>a===b||parentOf(a,props)===b||parentOf(b,props)===a; /* two flats of one place are separate */
  const live=b=>b&&!b.deleted_at&&String(b.booking_status||'Confirmed')!=='Cancelled'&&b.check_in&&b.check_out;
  /* a manager's stays: their list plus the whole place over their flats and the flats of a whole place they manage */
  function scope(ids,props){ids=list(ids);const set=new Set(ids);(props||[]).forEach(p=>{const inc=list(p.includes);
    if(inc.some(k=>set.has(k)))set.add(p.property_id);if(ids.includes(p.property_id))inc.forEach(k=>set.add(k))});return set}
  /* checkout checklists: one per stay that ended since the start date */
  /* a same-day turnover (the next guest checks in the day this one leaves) must be ready by check-in time: urgent */
  function checklists(bookings,rows,today,c,inScope,props){const byB={};(rows||[]).forEach(r=>{if(r.booking_id)byB[String(r.booking_id)]=r});
    const L=(bookings||[]).filter(live);
    return L.filter(b=>String(b.check_out).slice(0,10)>=c.start&&String(b.check_out).slice(0,10)<=today&&(!inScope||inScope(b.property_id)))
      .map(b=>{const co=String(b.check_out).slice(0,10),r=byB[String(b.booking_id)],due=addD(co,c.grace);
        const next=L.find(x=>x!==b&&String(x.check_in).slice(0,10)===co&&overlap(x.property_id,b.property_id,props));
        return{booking:b,property_id:b.property_id,check_out:co,due,row:r||null,status:r?'done':today>due?'missed':'due',missedAt:r?null:due,
          sameDay:!!next,next:next||null,urgent:!!next&&!r&&co===today,dueTime:next?String(next.arrival_time||c.checkinTime||'13:00').slice(0,5):null}})
      .sort((a,b)=>(b.urgent-a.urgent)||b.check_out.localeCompare(a.check_out))}
  /* stock checks: every N days per real place (a whole place is its flats) */
  function stock(props,rows,today,c,inScope){const out=[];
    (props||[]).filter(p=>!list(p.includes).length&&!/^(stopped|inactive)$/i.test(String(p.status||''))&&(!inScope||inScope(p.property_id))).forEach(p=>{
      const mine=(rows||[]).filter(r=>r.property_id===p.property_id).map(r=>({...r,day:String(r.done_at||r.submitted_at||'').slice(0,10)})).filter(r=>r.day);
      let a=c.start,done=0,missed=0,missedAt=[],cur=null;
      for(let i=0;i<200&&a<=today;i++){const z=addD(a,c.every),hit=mine.find(r=>r.day>=a&&r.day<z);
        if(z>today){cur={from:a,until:addD(z,-1),status:hit?'done':'due',row:hit||null};break}
        if(hit)done++;else{missed++;missedAt.push(z)}a=z}
      const last=mine.sort((x,y)=>y.day.localeCompare(x.day))[0]||null;
      out.push({property_id:p.property_id,current:cur,done,missed,missedAt,last})});return out}
  /* the last n counts for a place, newest first: [{day, counts, by}] */
  function stockTrend(rows,pid,n){return(rows||[]).filter(r=>r.property_id===pid).map(r=>({day:String(r.done_at||r.submitted_at||'').slice(0,10),counts:js(r.counts)||{},by:r.by_name||r.by||''}))
    .filter(r=>r.day).sort((a,b)=>b.day.localeCompare(a.day)).slice(0,n||4)}
  /* below the minimum at the latest count, per place: what to buy */
  function shopping(props,rows,c){const out=[];(props||[]).filter(p=>!list(p.includes).length&&!/^(stopped|inactive)$/i.test(String(p.status||''))).forEach(p=>{
    const last=stockTrend(rows,p.property_id,1)[0];if(!last)return;stockItemsFor(c,p.property_id,props).filter(it=>it.min&&it.type!=='ok').forEach(it=>{const have=+last.counts[it.name];
      if(isFinite(have)&&have<it.min)out.push({property_id:p.property_id,city:p.city||'',item:it.name,have,min:it.min,need:it.min-have,day:last.day})})});return out}
  /* guest reviews: platform stays (Airbnb by default) have a window after check-out to be reviewed */
  function reviews(bookings,rows,today,c,inScope){const byB={};(rows||[]).forEach(r=>{if(r.booking_id)byB[String(r.booking_id)]=r});
    return(bookings||[]).filter(b=>live(b)&&c.channels.includes(String(b.channel))&&String(b.check_out).slice(0,10)>=c.start&&String(b.check_out).slice(0,10)<=today&&(!inScope||inScope(b.property_id)))
      .map(b=>{const co=String(b.check_out).slice(0,10),r=byB[String(b.booking_id)]||null,end=addD(co,c.window),left=dayDiff(today,end),st=String(r&&r.status||'');
        const status=st==='received'?'received':st==='missed'||(left<0&&st!=='received')?'missed':st==='asked'?'asked':'open';
        return{booking:b,property_id:b.property_id,check_out:co,ends:end,left,row:r,status,missedAt:status==='missed'?(r&&r.decided_at)||end:null}})
      .sort((a,b)=>a.ends.localeCompare(b.ends))}
  /* who a manager is in the rows the server writes: their email, else login:<id> */
  const idOf=u=>String(u.email||(u.login?'login:'+u.login:'')).toLowerCase();
  /* per manager: work done is credited to whoever did it (even at a stay they no longer have); missed and due follow
     the stays they have now. Rows from before credit was recorded fall back to the name. */
  function scorecards(staff,data,today,c){return(staff||[]).filter(u=>String(u.role||'').toLowerCase()==='manager').map(u=>{
    const set=scope(u.properties,data.props),inS=pid=>set.has(pid),me=idOf(u),nm=String(u.name||'').trim().toLowerCase();
    const mine=(r,idk,nk)=>{const id=String(r[idk]||'').toLowerCase();return id?id===me:!!nm&&String(r[nk]||'').trim().toLowerCase()===nm};
    const cl=checklists(data.bookings,data.checklists,today,c,inS,data.props),rv=reviews(data.bookings,data.reviews,today,c,inS),sk=stock(data.props,data.stock,today,c,inS);
    const cnt=(a,s)=>a.filter(x=>x.status===s).length,start=r=>String(r.done_at||r.submitted_at||r.asked_at||'').slice(0,10)>=c.start;
    const got=(data.reviews||[]).filter(r=>r.status==='received'&&mine(r,'asked_by_id','asked_by')),rated=got.filter(r=>+r.rating>0);
    return{user:u,stays:[...set],reviews:{received:got.length,missed:cnt(rv,'missed'),asked:cnt(rv,'asked'),open:cnt(rv,'open'),
        avg:rated.length?Math.round(rated.reduce((t,r)=>t+ +r.rating,0)/rated.length*10)/10:null,low:got.filter(r=>r.low==='Yes').length},
      checklists:{done:(data.checklists||[]).filter(r=>start(r)&&mine(r,'by','by_name')).length,missed:cnt(cl,'missed'),due:cnt(cl,'due')},
      stock:{done:(data.stock||[]).filter(r=>start(r)&&mine(r,'by','by_name')).length,missed:sk.reduce((t,x)=>t+x.missed,0),due:sk.filter(x=>x.current&&x.current.status==='due').length}}})}
  /* turnover time: check-out time to the checklist being sent, in hours; on time = before the next guest's arrival */
  const at=(day,t)=>new Date(String(day).slice(0,10)+'T'+String(t||'00:00').slice(0,5)+':00').getTime();
  function turnovers(bookings,rows,c,props){const L=(bookings||[]).filter(live),byB={};(rows||[]).forEach(r=>{if(r.booking_id&&r.done_at)byB[String(r.booking_id)]=r});
    return L.filter(b=>byB[String(b.booking_id)]).map(b=>{const r=byB[String(b.booking_id)],co=String(b.check_out).slice(0,10),done=new Date(String(r.done_at).replace(' ','T')).getTime();
      const next=L.filter(x=>x!==b&&String(x.check_in).slice(0,10)>=co&&overlap(x.property_id,b.property_id,props)).sort((x,y)=>String(x.check_in).localeCompare(String(y.check_in)))[0];
      const ready=next?at(next.check_in,next.arrival_time||c.checkinTime):null,hours=isNaN(done)?null:Math.max(0,Math.round((done-at(co,c.checkoutTime))/36e5*10)/10);
      return{booking_id:String(b.booking_id),property_id:b.property_id,check_out:co,by:r.by||null,by_name:r.by_name||null,done_at:String(r.done_at),hours,
        next:next?String(next.booking_id):null,onTime:ready==null||isNaN(done)?null:done<=ready}})}
  /* not ready: a guest arrives today (or by `ahead` days) and the stay's last check-out has no checklist yet */
  function notReady(bookings,rows,today,c,props,ahead){const L=(bookings||[]).filter(live),done=new Set((rows||[]).map(r=>String(r.booking_id||''))),last=addD(today,ahead||0);
    return L.filter(n=>{const ci=String(n.check_in).slice(0,10);return ci>=today&&ci<=last}).map(n=>{const ci=String(n.check_in).slice(0,10);
      const prev=L.filter(b=>b!==n&&String(b.check_out).slice(0,10)<=ci&&String(b.check_out).slice(0,10)>=c.start&&overlap(b.property_id,n.property_id,props))
        .sort((x,y)=>String(y.check_out).localeCompare(String(x.check_out)))[0];
      return prev&&!done.has(String(prev.booking_id))?{next:n,prev,property_id:n.property_id,check_in:ci,readyBy:String(n.arrival_time||c.checkinTime).slice(0,5)}:null}).filter(Boolean)}
  /* a manager's month: the scorecard for that month plus turnover time, issues, damage and days worked */
  function monthKPIs(staff,data,month,today,c){const s=month+'-01',e=addD(addD(s,32).slice(0,7)+'-01',-1),to=e<today?e:today,cm={...c,start:s>c.start?s:c.start};
    const M=data.maint||data.maintenance||[],tv=turnovers(data.bookings,data.checklists,c,data.props).filter(t=>t.check_out>=s&&t.check_out<=e);
    const inM=v=>String(v||'').slice(0,10)>=s&&String(v||'').slice(0,10)<=e;
    return scorecards(staff,data,to,cm).map(x=>{const u=x.user,me=idOf(u),nm=String(u.name||'').trim().toLowerCase();
      const mine=r=>{const id=String(r.by||'').toLowerCase();return id?id===me:!!nm&&String(r.by_name||r.reported_by||'').trim().toLowerCase()===nm};
      const t=tv.filter(mine),hrs=t.filter(v=>v.hours!=null).map(v=>v.hours),known=t.filter(v=>v.onTime!=null),iss=M.filter(m=>mine(m)&&inM(m.reported_on));
      const days=new Set(['checklists','stock','maintenance','turnovers','movements'].flatMap(k=>(k==='maintenance'?M:data[k]||[]).filter(mine).map(r=>String(r.done_at||r.submitted_at||r.at||r.reported_on||'').slice(0,10)).filter(inM)));
      const outs=(data.bookings||[]).filter(b=>live(b)&&inM(b.check_out)&&String(b.check_out).slice(0,10)<=to&&x.stays.includes(b.property_id)).length;
      return{...x,month,checkouts:outs,turnover:{count:t.length,avgHours:hrs.length?Math.round(hrs.reduce((a,b)=>a+b,0)/hrs.length*10)/10:null,onTime:known.filter(v=>v.onTime).length,late:known.filter(v=>!v.onTime).length},
        issues:{reported:iss.filter(m=>m.kind!=='damage').length,damage:iss.filter(m=>m.kind==='damage').length,fixed:M.filter(m=>String(m.mgr_status||'')==='fixed'&&mine({by:m.mgr_by,by_name:m.mgr_name})&&inM(m.mgr_at)).length},
        days:days.size}})}
  /* when a row arrived: its own timestamp, or the time inside a bot id like EX18c2f... */
  const stamp=r=>{const t=r.submitted_at||r.created_at||r.done_at||r.asked_at||r.decided_at||r.confirmed_at||r.approved_at||null;if(t)return String(t);
    if(r.reported_at&&+r.reported_at>1e9)return new Date(+r.reported_at*1000).toISOString();
    const m=/^EX([0-9a-f]{10,12})$/i.exec(String(r.expense_id||''));if(m){const ms=parseInt(m[1],16);if(ms>1.5e12&&ms<2.5e12)return new Date(ms).toISOString()}
    return r.reported_on?String(r.reported_on)+'T12:00':null};
  const after=(t,since)=>t&&String(t).replace(' ','T')>since;

let LANG=store.get('mg_lang')||'en';const T=s=>LANG==='hi'&&HI[s]||s;
const G=(n,one,many)=>`${n} ${T(+n===1?one:(many||one+'s'))}`;
/* ============ the Register (same Google Sheet as the dashboard and the WhatsApp bot) ============ */
const S={key:store.get('mg_session')||'',me:store.get('mg_me')||null,d:store.get('mg_cache')||null,tab:'today',busy:false,q:0};
/* a WhatsApp alert links straight to a tab: .../manager/#issues */
const hashTab=()=>{const k=location.hash.slice(1);if(k==='stock'){S.chk='stock';return'check'}return['today','stays','check','reviews','issues'].includes(k)?k:null};
if(hashTab())S.tab=hashTab();addEventListener('hashchange',()=>{const k=hashTab();if(k&&k!==S.tab){S.tab=k;render();scrollTo(0,0)}});
/* no answer in 12 s (20 s for a photo) counts as offline, so a weak signal never leaves "Saving…" spinning: the work goes
   to the outbox instead. No network at all: offline at once (M-28) */
const TMO=12000,TMO_UP=20000,offErr=()=>{const x=new Error('offline');x.offline=true;return x};
async function post(body,ms){if(navigator.onLine===false)throw offErr();const ac=window.AbortController?new AbortController():null,tm=ac&&setTimeout(()=>ac.abort(),ms||TMO);
  try{const r=await fetch(CLIENT.api_url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),signal:ac?ac.signal:undefined});return await r.json()}
  catch(e){throw offErr()}finally{clearTimeout(tm)}}
async function api(body,ms){const j=await post({key:S.key,device:'Manager app',...body},ms);if(j.error){const x=new Error(j.error);x.server=true;throw x}return j}
async function load(){S.busy=true;const k0=S.key;try{const d=await api({action:'read',format:'dashboard'});if(S.key!==k0)return;   // signed out meanwhile: keep nothing
    S.d={props:d.props||[],bookings:(d.bookings||[]).map(b=>({...b,booking_id:String(b.booking_id),check_in:String(b.check_in).slice(0,10),check_out:String(b.check_out).slice(0,10)})),maint:d.maint||[],reviews:d.reviews||[],
      checklists:d.checklists||[],requests:d.requests||[],stock:d.stock||[],turnovers:d.turnovers||[],claims:d.claims||[],movements:d.movements||[],ops:d.ops||[],leaves:d.leaves||[],plan:d.plan||null,checkin_info:d.checkin_info||[],directory:d.directory||[],at:Date.now()};
    if(d.me){S.me=d.me;store.set('mg_me',d.me)}store.set('mg_cache',S.d);await queued()}
  catch(e){if(/unauthorized/.test(e.message)){try{await api({action:'me'})}catch(x){if(/unauthorized/.test(x.message))return signOut('Your sign-in ended. Sign in again.')}}
    toast(S.d?'Couldn’t refresh just now · showing the last data':'Couldn’t reach the sheet. Check the connection.')}finally{S.busy=false;render()}}
function signOut(msg){api({action:'logout'}).catch(()=>{});S.key='';S.me=null;S.d=null;store.set('mg_session','');store.set('mg_me',null);store.set('mg_cache',null);loginScreen(msg)}
/* ============ outbox: anything saved without a connection waits on the phone (with its photos) and is sent when the
   connection is back. A refusal from the sheet (not your stay, etc.) is shown and dropped: retrying would not help. ============ */
const OB=(()=>{let dbP=null;const db=()=>dbP=dbP||new Promise((ok,no)=>{if(!window.indexedDB)return no(new Error('no idb'));const r=indexedDB.open('mg_outbox',1);r.onupgradeneeded=()=>r.result.createObjectStore('q',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
  const tx=(mode,fn)=>db().then(d=>new Promise((ok,no)=>{const t=d.transaction('q',mode),st=t.objectStore('q'),res=fn(st);t.oncomplete=()=>ok(res&&res.result);t.onerror=()=>no(t.error)}));
  const ls=()=>store.get('mg_outbox')||[];
  return{add:it=>tx('readwrite',st=>st.put(it)).catch(()=>{const a=ls();a.push(it);store.set('mg_outbox',a)}),
    all:()=>tx('readonly',st=>st.getAll()).then(a=>(a||[]).concat(ls())).catch(()=>ls()),
    del:id=>tx('readwrite',st=>st.delete(id)).catch(()=>{}).then(()=>store.set('mg_outbox',ls().filter(x=>x.id!==id)))}})();
/* each saved change carries who made it; only theirs is sent or counted, so a shared phone never sends A's work as B (M-33) */
const mineQ=it=>!it.by||it.by===myId();
async function queued(){const a=(await OB.all()).filter(mineQ);S.q=a.length;return a}
async function sendOne(it){const p=JSON.parse(JSON.stringify(it.payload));
  if(it.photos&&it.photos.length){const urls=[],slots={};for(let i=0;i<it.photos.length;i++){const ph=it.photos[i],r=await api({action:'upload',kind:it.kind||'checklist',name:`${it.name||'photo'} ${i+1}`,mime:'image/jpeg',data:ph.b64},TMO_UP);const u=r.thumb||r.url;urls.push(u);if(ph.slot)(slots[ph.slot]=slots[ph.slot]||[]).push(u)}
    if(p.fields)p.fields[it.photoField||'photos']=urls.length===1?urls[0]:JSON.stringify(urls);   // an update (a task's done photo)
    else{p.row[it.photoField||'photos']=JSON.stringify(urls);if(Object.keys(slots).length)p.row.photo_slots=JSON.stringify(slots)}}
  await api({action:it.op,tab:it.tab,...p})}
let flushing=false;
async function flush(){if(flushing||!S.key)return;flushing=true;let sent=0;try{for(const it of(await OB.all()).filter(mineQ).sort((a,b)=>a.id.localeCompare(b.id))){try{await sendOne(it);await OB.del(it.id);sent++}
    catch(e){if(e.offline)break;await OB.del(it.id);toast(`${it.label||'A change'} wasn’t accepted: ${e.message.replace(/^not allowed: /,'')}`)}}}finally{flushing=false;await queued();if(sent){toast(`${sent} saved change${sent>1?'s':''} sent ✓`);load()}else render()}}
/* Geotag: where the phone is when a checklist, stock check or issue is sent. The sheet works out the distance to the
   stay's map pin and flags anything over 200 m to the admin. Location refused = it can't be sent; no GPS fix in 15 s =
   sent anyway, marked "no location". Off when the admin sets ops.geotag = off. */
const geoOn=()=>{const r=((S.d||{}).ops||[]).filter(x=>x.key==='ops.geotag').pop(),pf=(((S.d||{}).plan||{}).features||{}).geotag;return!(r&&/^(off|no|false|0)$/i.test(String(r.value||'').trim()))&&!/^(off|no|false|0)$/i.test(String(pf||''))};
function geoNow(){return new Promise(ok=>{if(!navigator.geolocation)return ok({flag:'no_fix'});
  navigator.geolocation.getCurrentPosition(p=>ok({lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy||0)}),
    e=>ok(e&&e.code===1?{denied:true}:{flag:'no_fix'}),{enableHighAccuracy:true,timeout:15000,maximumAge:60000})})}
async function geoFields(err){if(!geoOn())return{};const g=await geoNow();
  if(g.denied){err.hidden=false;err.textContent=T('Location is off for this app. Allow location in your phone settings, then send again. It confirms you are at the stay.');return null}
  return g.flag?{geo_flag:g.flag,geo_at:nowIso()}:{geo_lat:g.lat,geo_lng:g.lng,geo_acc_m:g.acc,geo_at:nowIso()}}
/* send now; without a connection keep it in the outbox and show it as done */
async function write(op,tab,payload,msg,extra){if(['readonly','off'].includes(String(((S.d||{}).plan||{}).status||''))){toast(T('Read-only for now · ask your admin'));return false}const it={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),by:myId(),op,tab,payload,label:msg,...(extra||{})};
  try{if(navigator.onLine===false)throw offErr();await sendOne(it);toast(T(msg)+' ✓');return'sent'}
  catch(e){if(!e.offline){toast('Not saved: '+e.message.replace(/^not allowed: /,''));return false}
    await OB.add(it);await queued();localApply(op,tab,payload);toast(T('Saved on the phone · sends when online'));return'queued'}}
function localApply(op,tab,p){const k={maintenance:'maint'}[tab]||tab;if(!S.d||!S.d[k])return;
  if(op==='append')S.d[k].push({...p.row,status:tab==='maintenance'?'Pending approval':tab==='claims'?'pending':p.row.status,_queued:true});

const OPENC={};
function openNews(){const cats=news(),since=seenAt(),w=t=>{const d=new Date(String(t).replace(' ','T'));return isNaN(d)?'':d.toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})};
  const close=sheet(T("What's new"),h('p',{class:'hint'},'Since '+w(since)),...(cats.length?cats.map(c=>h('div',{class:'news-c'},h('b',null,c.label,h('span',null,c.items.length)),...c.items.slice(0,OPENC[c.key]?99:4).map(it=>h('div',{class:'news-i'},h('span',null,it.title),h('small',null,[it.sub,w(it.at)].filter(Boolean).join(' · ')))),
      c.items.length>4?h('button',{class:'btn sm',onclick:()=>{OPENC[c.key]=!OPENC[c.key];close();openNews()}},OPENC[c.key]?'Show fewer':'Show all '+c.items.length):null)):[h('div',{class:'empty'},T('Nothing new since you last looked.'))]),
    cats.length?h('button',{class:'btn primary full',onclick:()=>{const at=new Date().toISOString();store.set(SEEN,at);if(S.me)S.me.seen_at=at;api({action:'seen',at}).catch(()=>{});close();render()}},T('Mark all seen')):null)}
function openMenu(){const close=sheet(T('Menu'),h('div',{class:'form'},h('p',{class:'hint'},`Signed in as ${S.me&&S.me.name||''}${S.me&&S.me.login?' ('+S.me.login+')':''}. Data from ${S.d&&S.d.at?new Date(S.d.at).toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'}):'–'}.`),
  S.q?h('p',{class:'hint'},`${S.q} ${T('waiting to send')}.`):null,langBtn(),
  h('button',{class:'btn full',onclick:()=>{close();leaveSheet()}},icon('today'),T('Leave')),
  h('button',{class:'btn full',onclick:()=>{close();helpSheet()}},T('Help')),
  h('button',{class:'btn full',onclick:()=>{close();flush();load();toast('Refreshing…')}},icon('sync'),T('Refresh now')),h('button',{class:'btn full',onclick:()=>{close();askSignOut()}},T('Sign out'))))}
/* signing out with changes still on the phone: send them now, or leave them for the next time this person signs in */
async function askSignOut(){const n=(await queued()).length;if(!n)return signOut();
  const close=sheet(T('Sign out'),h('p',{class:'hint'},`${n} ${T(n===1?'change not sent yet':'changes not sent yet')}. ${T('They stay on this phone and send the next time you sign in.')}`),
    h('div',{class:'form'},h('button',{class:'btn primary full',onclick:async e=>{const b=e.currentTarget;b.disabled=true;b.textContent=T('Sending…');await flush();const left=(await queued()).length;close();if(left){toast(`${left} ${T('waiting to send')}`);render()}else signOut()}},T('Send now')),
      h('button',{class:'btn full',onclick:()=>{close();signOut()}},T('Sign out anyway'))))}
/* ============ start ============ */
document.documentElement.lang=LANG;
render();if(S.key){queued().then(()=>{flush();load()})}
setInterval(()=>{if(S.key&&!document.hidden&&!S.busy){flush();load()}},3*60*1000);
addEventListener('online',()=>{if(S.key)flush()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.key&&S.d&&Date.now()-S.d.at>60000){flush();load()}});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
