<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f8fc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jabula">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="robots" content="noindex,nofollow">
<title>Jabula Getaways</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://images.unsplash.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Travel-brand look: bright paper, navy ink, royal blue, serif display with italic accent line, photo hero in a wavy mask, floating pill filter bar. */
:root{
  --bg:#f6f8fc; --surface:#ffffff; --surface-2:#f2f5fb;
  --glass:#ffffff; --glass-2:#ffffff; --glass-line:#e7ecf4;
  --hair:#eef2f8; --hair-2:#dde4ef;
  --ink:#0c1a3d; --ink-2:#2f3d5e; --muted:#66728d; --faint:#9aa4ba;
  --accent:#1d5bd8; --accent-2:#3d7bff; --accent-soft:#eaf1ff; --accent-ink:#1749b8;
  --ok:#12804c; --ok-soft:#e3f5eb; --warn:#b4570a; --warn-soft:#fff1de; --bad:#d6342c; --bad-soft:#fdecea;
  --c-airbnb:#ff385c; --c-booking:#2f6fe0; --c-mmt:#d97706; --c-direct:#16a34a; --c-website:#7c3aed;
  --city-1:#0e9f8b; --city-2:#e0742f; --city-3:#8b5cf6;
  --seg:#eef2f8; --seg-on:#ffffff; --tipbg:#0c1a3d; --tipink:#fff;
  --shadow:0 1px 2px rgba(12,26,61,.04),0 12px 32px -18px rgba(12,26,61,.18);
  --shadow-lg:0 30px 70px -28px rgba(12,26,61,.38);
  --font:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --serif:"DM Serif Display",Georgia,"Times New Roman",serif;
  --r:22px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,a,input,select,label,[role=button]{touch-action:manipulation}
.skip{position:absolute;left:12px;top:-60px;z-index:100;background:var(--ink);color:#fff;padding:10px 14px;border-radius:12px;font-weight:700;text-decoration:none}
.skip:focus{top:12px}
.modal,.sheet .in,.pop,.menu,.hm-wrap,.tbl-wrap{overscroll-behavior:contain}
.mcard:hover{border-color:var(--hair-2);box-shadow:var(--shadow)}
[role=button]{cursor:pointer}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
.num{font-variant-numeric:tabular-nums}
.serif{font-family:var(--serif);font-weight:400;letter-spacing:-.01em}
.shell{position:relative;max-width:1440px;margin:0 auto;padding:0 max(28px,env(safe-area-inset-right,0px)) 48px max(28px,env(safe-area-inset-left,0px))}
.glass{background:var(--surface);border:1px solid var(--glass-line);box-shadow:var(--shadow)}

/* ---------- top bar ---------- */
.topbar{position:relative;z-index:40;display:flex;align-items:center;gap:16px;height:68px;padding-top:env(safe-area-inset-top,0px)}
.brand{display:flex;gap:11px;align-items:center;border:0;background:none;padding:0;text-align:left}
.mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(150deg,#3d7bff,#1d5bd8 55%,#123c9c);display:grid;place-items:center;box-shadow:0 10px 22px -10px rgba(29,91,216,.75);flex:none}
.brand b{font-family:var(--serif);font-weight:400;font-size:19px;letter-spacing:-.01em;display:block;line-height:1.05;white-space:nowrap}
.brand small{white-space:nowrap}
.brand small{font-size:11.5px;color:var(--muted);font-weight:500}
.nav{display:flex;gap:4px;margin:0 auto;align-items:center}
.nav button{position:relative;border:0;background:none;padding:9px 11px 13px;font-size:13px;font-weight:600;color:var(--ink-2);border-radius:12px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.nav button:hover{color:var(--ink)}
.nav button[aria-current="page"]{color:var(--ink);font-weight:700}
.nav button[aria-current="page"]::after{content:"";position:absolute;left:50%;bottom:4px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--accent)}
.nav svg{display:none}
.nav .badge{font-size:10.5px;font-weight:700;color:var(--muted);background:var(--hair);border-radius:99px;padding:0 6px;line-height:17px}
.nav .badge.hot{background:var(--bad);color:#fff}
.top-r{display:flex;align-items:center;gap:10px}
.circle{width:40px;height:40px;border-radius:50%;border:1px solid var(--glass-line);background:var(--surface);display:grid;place-items:center;box-shadow:var(--shadow);flex:none;padding:0}
.circle svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.circle:hover{border-color:var(--accent)}
.status-pill{font-size:11px;font-weight:700;border-radius:99px;padding:4px 10px;background:var(--warn-soft);color:var(--warn);white-space:nowrap}
.status-pill.view{background:var(--accent-soft);color:var(--accent-ink)}
.menu{position:absolute;right:max(28px,env(safe-area-inset-right,0px));top:64px;z-index:60;width:300px;border-radius:22px;padding:16px;background:var(--surface);border:1px solid var(--glass-line);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;gap:14px}
.menu[hidden]{display:none}
.menu h3{margin:0;font-size:12px;color:var(--muted);font-weight:600}
.menu .row{display:flex;gap:8px;flex-wrap:wrap}
.sync{font-size:12px;color:var(--ink-2);display:flex;gap:9px;align-items:flex-start;line-height:1.5}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);margin-top:5px;flex:none;box-shadow:0 0 0 4px var(--ok-soft)}

/* ---------- controls ---------- */
.seg{display:inline-flex;background:var(--seg);border-radius:99px;padding:3px;gap:2px;flex-wrap:nowrap;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:none;border-radius:99px;padding:7px 14px;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--seg-on);color:var(--ink);box-shadow:0 1px 3px rgba(12,26,61,.12)}
.btn{border:1px solid var(--hair-2);background:var(--surface);border-radius:99px;padding:8px 15px;font-size:12.5px;font-weight:650;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;color:var(--ink)}
.btn:hover{border-color:var(--accent);color:var(--accent-ink)}
.btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.primary{background:var(--accent);color:#fff;border-color:transparent;box-shadow:0 12px 24px -12px rgba(29,91,216,.8)}
.btn.primary:hover{background:var(--accent-ink);color:#fff}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.sm{padding:6px 12px;font-size:12px}
.btn.icon{padding:7px;border-radius:50%}
.btn.cta{padding:5px 5px 5px 18px;font-size:13px;gap:12px;height:44px}
.btn.cta .arr{width:34px;height:34px;border-radius:50%;background:#fff;color:var(--accent);display:grid;place-items:center}
.btn.cta .arr svg{width:17px;height:17px}
.btn.ghost{background:none;border-color:transparent;box-shadow:none}
.date{background:var(--surface);border:1px solid var(--hair-2);border-radius:12px;padding:7px 10px;font-size:12.5px}
.search{background:var(--surface);border:1px solid var(--hair-2);border-radius:99px;padding:10px 16px;font-size:13px;min-width:0}
.search:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.range-label{font-size:12.5px;font-weight:600;color:var(--ink-2);padding:0 6px;white-space:nowrap}
.grow{flex:1}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:11.5px;font-weight:700;letter-spacing:.2em;color:var(--accent);text-transform:uppercase}
.eyebrow svg{flex:none}

/* ---------- page head (non-overview) ---------- */
.pagehead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:10px 4px 20px}
.pagehead h1{margin:6px 0 0;font-family:var(--serif);font-weight:400;font-size:clamp(30px,3.2vw,42px);line-height:1;letter-spacing:-.015em}
.pagehead h1 em{color:var(--accent);font-style:italic}
.pagehead .sub{color:var(--muted);font-size:13px;margin-top:8px;max-width:60ch}

/* ---------- hero ---------- */
.hero{position:relative;min-height:350px;margin-top:4px;display:flex;align-items:center}
.hero-copy{position:relative;z-index:2;width:min(560px,52%);padding:8px 0 92px 4px;display:flex;flex-direction:column;gap:16px}
.hero h1{margin:0;font-family:var(--serif);font-weight:400;font-size:clamp(34px,3.6vw,54px);line-height:1;letter-spacing:-.02em;color:var(--ink)}
.hero h1 em{display:block;font-style:italic;color:var(--accent)}
.hero p{margin:0;color:var(--ink-2);font-size:14px;line-height:1.6;max-width:46ch}
.hero p b{color:var(--ink);font-weight:700}
.hero-acts{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
/* Full-bleed photo that fades into the page on the left and at the bottom. Gradients, not masks: cheap to paint. */
.hero-media{position:absolute;top:-68px;bottom:0;left:24%;right:calc(-1 * max(28px,env(safe-area-inset-right,0px)));z-index:1}
.hero-photo{position:absolute;inset:0;overflow:hidden;background:var(--bg)}
.hero-photo img{width:100%;height:100%;object-fit:cover;object-position:50% 72%;display:block;opacity:0;transition:opacity .6s ease}
.hero-photo img.ld{opacity:1}
.hero-photo::after{content:"";position:absolute;inset:0;pointer-events:none;background:
  linear-gradient(90deg,var(--bg) 0%,var(--bg) 3%,color-mix(in srgb,var(--bg) 82%,transparent) 15%,color-mix(in srgb,var(--bg) 35%,transparent) 32%,transparent 52%),
  linear-gradient(0deg,var(--bg) 0%,color-mix(in srgb,var(--bg) 55%,transparent) 14%,transparent 34%),
  linear-gradient(180deg,color-mix(in srgb,var(--bg) 70%,transparent) 0%,transparent 22%)}
.float-card{position:absolute;right:max(28px,env(safe-area-inset-right,0px));top:92px;z-index:3;width:200px;border-radius:22px;padding:14px 16px;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:var(--shadow-lg);color:#0c1a3d;display:flex;flex-direction:column;gap:10px;border:0;text-align:left}
.float-card .top{display:flex;align-items:center;gap:8px}
.float-card .n{margin-left:auto;width:42px;height:42px;border-radius:50%;background:#1d5bd8;color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px}
.float-card b{font-size:13.5px;font-weight:700;display:block}
.float-card small{font-size:11.5px;color:#66728d}
.avs{display:flex}
.avs .av{width:30px;height:30px;border:2px solid #fff;margin-left:-8px;font-size:10.5px}
.avs .av:first-child{margin-left:0}
.float-card .line{font-size:11.5px;color:#2f3d5e;border-top:1px solid #eef2f8;padding-top:8px}

/* ---------- floating filter bar ---------- */
.fwrap{position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:30;margin:0 auto 16px;max-width:1080px}
.hero + .fwrap{margin-top:-72px}
.fbar{display:flex;align-items:center;gap:0;border-radius:99px;padding:6px 6px 6px 10px;background:rgba(255,255,255,.96);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--glass-line);box-shadow:0 24px 60px -28px rgba(12,26,61,.4),0 2px 6px rgba(12,26,61,.04)}
.fseg{position:relative;flex:1 1 0;min-width:0;display:flex}
.fseg + .fseg::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:1px;background:var(--hair-2)}
.fbtn{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:none;padding:6px 12px;border-radius:99px;text-align:left}
.fbtn:hover{background:var(--surface-2)}
.fbtn[aria-expanded="true"]{background:var(--accent-soft)}
.fbtn .ic{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.fbtn .ic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.fbtn .tx{min-width:0;display:flex;flex-direction:column}
.fbtn .tx b{font-size:12.5px;font-weight:700;color:var(--ink);white-space:nowrap}
.fbtn .tx span{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbtn .chev{margin-left:auto;color:var(--faint);flex:none}
.fbtn .n{background:var(--accent);color:#fff;border-radius:99px;font-size:10px;font-weight:700;padding:0 6px;line-height:16px;margin-left:4px}
.fgo{width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none;margin-left:8px;box-shadow:0 12px 24px -10px rgba(29,91,216,.8)}
.fgo svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.fgo:hover{background:var(--accent-ink)}
.fgo.spin svg{animation:spin .8s linear}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:12px 18px 0}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent-ink);border:0;border-radius:99px;padding:5px 6px 5px 12px;font-size:12px;font-weight:650}
.chip i{font-style:normal;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.7);font-size:10px}
.chip.ghost{background:none;color:var(--muted);padding:5px 10px}
.pop{position:absolute;top:calc(100% + 12px);left:0;z-index:40;width:300px;max-height:380px;overflow:auto;border-radius:20px;padding:10px;background:var(--surface);border:1px solid var(--glass-line);box-shadow:var(--shadow-lg)}
.pop .grp{font-size:11.5px;font-weight:700;color:var(--muted);padding:8px 8px 4px}
.pop label{display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:12px;font-size:13px;cursor:pointer}
.pop label:hover{background:var(--surface-2)}
.pop input[type=checkbox],.pop input[type=radio]{accent-color:var(--accent);width:16px;height:16px;margin:0}
.pop .search{width:100%;margin-bottom:6px}
.pop-foot{display:flex;justify-content:space-between;padding:8px 4px 2px;border-top:1px solid var(--hair);margin-top:6px}
.pop .dates{display:flex;gap:6px;align-items:center;padding:8px 6px 4px;flex-wrap:wrap}
.pop-h{display:none}
.pop.r{left:auto;right:0}

/* ---------- grid & cards ---------- */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-flow:row dense;gap:14px}
.s2{grid-column:span 2}.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.card{border-radius:var(--r);padding:16px 18px 18px;min-width:0;display:flex;flex-direction:column;gap:12px}
.card-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.card{container-type:inline-size}
.card.clip{overflow:hidden}
.card.clip .tbl-wrap{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain}
.card.clip .tbl-wrap::after{content:"";position:sticky;bottom:0;display:block;height:28px;margin-top:-28px;background:linear-gradient(transparent,var(--surface));pointer-events:none}
.deskp{align-self:start}
.mix{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}
.mix-l{display:flex;flex-direction:column;gap:6px}
@container (max-width:520px){.mix{grid-template-columns:minmax(0,1fr);justify-items:center;gap:12px}.mix .chart{width:176px}.mix-l{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 16px;width:100%}}
.mini-cities{display:flex;flex-direction:column;gap:2px}
.mini-cities .hb{grid-template-columns:110px 1fr 40px}
.card-h h2{margin:0;font-family:var(--serif);font-weight:400;font-size:20px;letter-spacing:-.01em;line-height:1.1}
.card-h .hint{font-size:12px;color:var(--muted)}
.card-h .acts{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.kpi{border-radius:22px;padding:16px 18px;min-width:0;display:flex;flex-direction:column;gap:5px;position:relative;overflow:hidden;cursor:default}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:600;display:flex;gap:6px;align-items:center}
.kpi .v{font-size:24px;font-weight:750;letter-spacing:-.03em;line-height:1.1;white-space:nowrap}
.kpi .foot{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;min-height:26px}
.delta{font-size:11px;font-weight:700;border-radius:99px;padding:2px 8px;white-space:nowrap}
.delta.up{background:var(--ok-soft);color:var(--ok)} .delta.down{background:var(--bad-soft);color:var(--bad)} .delta.flat{background:var(--hair);color:var(--muted)}
.kpi .cap{font-size:11.5px;color:var(--muted)}
.chart{width:100%;min-height:40px;position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--ink-2)}
.legend button{border:0;background:none;padding:2px 0;display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-2);font-weight:600}
.legend button[aria-pressed="false"]{opacity:.4}
.sw{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.tbl-wrap{overflow-x:auto;margin:0 -8px;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%}
.tbl th,.tbl td{padding:11px 10px;text-align:left;white-space:nowrap;font-size:12.5px;border-bottom:1px solid var(--hair)}
.tbl th{font-size:11.5px;font-weight:650;color:var(--muted);position:sticky;top:0;background:var(--surface)}
.tbl th.sort{cursor:pointer;user-select:none}
.tbl th.sort:hover{color:var(--ink)}
.tbl th .ar{opacity:.8;margin-left:3px}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover td{background:var(--surface-2)}
.tbl .r{text-align:right}
.tbl .m{color:var(--muted)}
.tbl tr.hl td{background:var(--accent-soft);font-weight:650}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 10px;font-size:11px;font-weight:700;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-bad{background:var(--bad-soft);color:var(--bad)}.p-acc{background:var(--accent-soft);color:var(--accent-ink)}.p-mute{background:var(--hair);color:var(--muted)}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700;flex:none}
.who b{font-weight:650;display:block;overflow:hidden;text-overflow:ellipsis}
.who span{font-size:11.5px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis}
.who>div{min-width:0}
.chd{display:inline-flex;align-items:center;gap:7px}
.chd i{width:8px;height:8px;border-radius:50%}
.empty{color:var(--muted);font-size:13px;padding:22px 4px;text-align:center}
.foot-note{font-size:12px;color:var(--muted)}
.sub-h{font-size:12px;font-weight:700;color:var(--muted);margin-top:4px}

/* ---------- overview: promo, stays carousel, stat strip ---------- */
.promo{position:relative;border-radius:28px;overflow:hidden;min-height:250px;color:#fff;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:26px 28px;background:#123c9c;border:0;text-align:left;isolation:isolate}
.promo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.promo::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(95deg,#0f3aa8 0%,rgba(22,74,206,.92) 38%,rgba(29,91,216,.35) 72%,rgba(29,91,216,0) 100%)}
.promo .tag{align-self:flex-start;font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:5px 11px}
.promo h3{margin:0;font-family:var(--serif);font-weight:400;font-size:34px;line-height:1.05;max-width:13ch}
.promo h3 span{color:#ffd27a}
.promo p{margin:0;font-size:13px;opacity:.9;max-width:30ch}
.promo .go{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;background:#fff;color:#1d5bd8;border-radius:99px;padding:9px 16px;font-weight:700;font-size:12.5px}
.promo .go svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.stays{display:flex;flex-direction:column;gap:14px;min-width:0}
.stays-h{display:flex;align-items:center;gap:10px}
.stays-h h2{margin:0;font-family:var(--serif);font-weight:400;font-size:22px}
.stays-h .acts{margin-left:auto;display:flex;gap:8px;align-items:center}
.link{border:0;background:none;color:var(--accent-ink);font-weight:700;font-size:12.5px;display:inline-flex;align-items:center;gap:4px;padding:4px}
.link svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(200px,1fr);gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:2px 2px 6px;-webkit-overflow-scrolling:touch}
.rail::-webkit-scrollbar{display:none}
.rail.wide{grid-auto-columns:minmax(230px,260px)}
.pcard{position:relative;scroll-snap-align:start;border:0;padding:0;border-radius:22px;overflow:hidden;aspect-ratio:4/5;background:#0c1a3d;color:#fff;text-align:left;box-shadow:var(--shadow);isolation:isolate}
.pcard>img,.pcard>svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.pcard::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(6,14,36,0) 45%,rgba(6,14,36,.78))}
.pcard:hover>img{transform:scale(1.05)}
.pcard .st{position:absolute;left:12px;top:12px;font-size:10.5px;font-weight:700;border-radius:99px;padding:4px 9px;background:rgba(255,255,255,.9);color:#0c1a3d}
.pcard .st.on{background:#12804c;color:#fff}
.pcard .meta{position:absolute;left:14px;right:14px;bottom:14px;display:flex;align-items:flex-end;gap:8px}
.pcard .meta b{display:block;font-size:15px;font-weight:700;line-height:1.2}
.pcard .meta span{font-size:12px;opacity:.85}
.pcard .rate{margin-left:auto;flex:none;background:#fff;color:#0c1a3d;border-radius:99px;padding:4px 9px;font-size:11.5px;font-weight:700;display:inline-flex;gap:4px;align-items:center}
.pcard .rate i{font-style:normal;color:#f5a524}
.strip-stats{border-radius:24px;padding:6px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0}
button.sstat{border:0;background:none;text-align:left;font:inherit;color:inherit}
button.sstat:hover{background:var(--surface-2)}
.sstat{display:flex;align-items:center;gap:12px;padding:10px 14px;position:relative;min-width:0;border-radius:20px}
.sstat + .sstat::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:1px;background:var(--hair-2)}
.sstat .ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none}
.sstat .ic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.sstat .tx{min-width:0;display:flex;flex-direction:column;gap:2px}
.sstat .v{font-size:19px;font-weight:800;letter-spacing:-.03em;line-height:1.1;white-space:nowrap}
.sstat .l{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.sstat .d{display:flex;gap:6px;align-items:center}
.sstat .sp{margin-left:auto;width:64px;flex:none}
@media (max-width:1560px){.sstat .sp{display:none}}

/* ---------- hbars & comparisons ---------- */
.hb{display:grid;grid-template-columns:minmax(80px,120px) 1fr auto;gap:12px;align-items:center;font-size:12.5px;padding:7px 4px;border:0;background:none;width:100%;text-align:left;border-radius:12px}
.hb:hover{background:var(--surface-2)}
.hb .t{height:8px;background:var(--hair);border-radius:99px;overflow:hidden}
.hb .t i{display:block;height:100%;border-radius:99px}
.hb .v{font-weight:700;text-align:right;min-width:64px}
.cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 22px}
@container (min-width:900px){.cmp{grid-template-columns:repeat(4,minmax(0,1fr))}}
@container (max-width:250px){.cmp{grid-template-columns:minmax(0,1fr)}}
.cmp-row{display:grid;grid-template-columns:1fr auto;gap:5px 8px;width:100%;border:0;background:none;padding:7px 0;text-align:left;font-size:12.5px;color:var(--ink-2);border-radius:8px}
.cmp-row b{font-size:13.5px;font-weight:700;color:var(--ink)}
.cmp-row .t{grid-column:1/-1;height:8px;background:var(--hair);border-radius:99px;overflow:hidden;display:block}
.cmp-row .t i{display:block;height:100%;border-radius:99px}
.cmp h3{margin:0 0 6px;font-size:12px;font-weight:700;color:var(--muted)}

/* ---------- desk ---------- */
.desk-list{display:flex;flex-direction:column}
.drow{display:grid;grid-template-columns:22px 56px minmax(0,1.3fr) minmax(0,1.2fr) auto;gap:12px;align-items:center;padding:12px 8px;border-bottom:1px solid var(--hair);border-radius:14px}
.drow:last-child{border-bottom:0}
.drow.on{background:var(--accent-soft)}
.drow input{accent-color:var(--accent);width:17px;height:17px}
.drow .time{font-size:16px;font-weight:750;letter-spacing:-.02em}
.drow .flags{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.prop-l b{font-weight:650;display:block}
.prop-l span{font-size:11.5px;color:var(--muted)}
.actionbar{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:25;border-radius:99px;padding:10px 10px 10px 22px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:var(--shadow-lg)}
.actionbar b{font-size:13px}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;cursor:pointer}
.toggle input{appearance:none;width:36px;height:22px;border-radius:99px;background:var(--hair-2);position:relative;transition:background .2s;margin:0}
.toggle input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.toggle input:checked{background:var(--accent)}
.toggle input:checked::after{left:17px}
.stat-row{display:flex;gap:12px;flex-wrap:wrap}
.stat{border-radius:20px;padding:14px 18px;min-width:120px;flex:1}
.stat b{font-size:22px;font-weight:800;letter-spacing:-.03em;display:block}
.stat span{font-size:12px;color:var(--muted);font-weight:600}

/* ---------- calendar ---------- */
.cal{overflow-x:auto;border-radius:18px;border:1px solid var(--hair);background:var(--surface);-webkit-overflow-scrolling:touch}
.cal-row{display:grid;align-items:center;min-height:38px;border-bottom:1px solid var(--hair)}
.cal-row:last-child{border-bottom:0}
.cal-name{position:sticky;left:0;z-index:2;background:var(--surface);padding:6px 12px;font-size:12px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:100%;display:flex;flex-direction:column;justify-content:center;border-right:1px solid var(--hair);grid-row:1;grid-column:1}
.cal-name span{font-size:10.5px;color:var(--muted);font-weight:500}
.cal-d{font-size:10px;color:var(--muted);text-align:center;font-weight:650;padding:7px 0;line-height:1.2}
.cal-d.we{color:var(--accent-ink)}
.cal-d.td span{background:var(--accent);color:#fff;border-radius:7px;padding:1px 5px}
.cal-cell{grid-row:1;height:100%;border-left:1px solid var(--hair)}
.cal-cell.td{background:var(--accent-soft)}
.cal-bar{grid-row:1;height:26px;margin:0 2px;border-radius:99px;border:0;color:#fff;font-size:10.5px;font-weight:700;padding:0 9px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;z-index:1;box-shadow:0 6px 12px -8px rgba(0,0,0,.45)}
.cal-bar.ol{border-top-left-radius:0;border-bottom-left-radius:0;margin-left:0}
.cal-bar.or{border-top-right-radius:0;border-bottom-right-radius:0;margin-right:0}
.cal-cell.we{background:color-mix(in srgb,var(--accent) 4%,transparent)}
.cal-fit{overflow:visible;border-radius:16px}
.cal-fit .cal-row:first-child{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--surface);border-radius:16px 16px 0 0;box-shadow:0 6px 10px -10px rgba(12,26,61,.35)}
.cal-fit .cal-name{background:var(--surface)}
.cal-week .cal-cell,.cal-fit:not(.cal-week) .cal-cell.we{border-left:1px solid var(--hair)}
.cal-week .cal-d{font-size:11px;font-weight:700;color:var(--ink-2)}
.cal-week .cal-d.we{color:var(--accent-ink)}
.cal-week .cal-bar{height:24px;font-size:10.5px;padding:0 6px;margin:0 1px;border-radius:8px}
.board-m{display:flex;flex-direction:column;gap:10px}
.board-m .seg{align-self:stretch}.board-m .seg button{flex:1}
.cal-fit .cal-row{min-height:34px}
.cal-fit .cal-name{padding:5px 8px;font-size:11.5px;white-space:normal;line-height:1.2;overflow-wrap:anywhere}
.cal-fit .cal-name span{font-size:10px}
.cal-fit .cal-d{padding:6px 0;font-size:9.5px}
.cal-fit .cal-bar{height:20px;margin:0;border-radius:6px;padding:0 4px;box-shadow:none;min-width:4px}
.cal-fit .cal-cell{border-left-color:transparent}
.mix-l .hb{min-width:0}
.next-up{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.nu{display:grid;grid-template-columns:10px 1fr;gap:2px 10px;align-items:center;text-align:left;border:1px solid var(--hair);background:var(--surface-2);border-radius:14px;padding:10px 12px}
.nu i{width:10px;height:10px;border-radius:50%;grid-row:1/3}
.nu b{font-size:12.5px;font-weight:700}
.nu span{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-occ{grid-row:1;font-size:11px;font-weight:700;text-align:right;padding-right:10px}

/* ---------- property page ---------- */
.phero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:26px;align-items:center}
.phero .img{border-radius:24px;overflow:hidden;aspect-ratio:16/11;max-width:100%}
.phero .img svg,.phero .img img{width:100%;height:100%;display:block;object-fit:cover}
.phero h2{margin:0;font-family:var(--serif);font-weight:400;font-size:34px;letter-spacing:-.015em;line-height:1}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.back svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.kpi .foot svg{width:100%;height:auto;display:block}
.back{border:0;background:none;color:var(--accent-ink);font-weight:700;padding:0;display:inline-flex;gap:4px;align-items:center}
.strip{display:grid;align-items:center;height:46px;border-radius:14px;background:var(--hair);position:relative;overflow:hidden}
.strip .bar{grid-row:1;height:30px;border-radius:8px;margin:0 1px;border:0;padding:0 6px;color:#fff;font-size:10px;font-weight:700;text-align:left;white-space:nowrap;overflow:hidden}
.strip .now{grid-row:1;width:2px;height:100%;background:var(--ink);justify-self:start;z-index:2}
.strip-l{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:6px}
.mlist{display:flex;flex-direction:column;gap:10px}
.mcard{display:flex;flex-direction:column;gap:10px;width:100%;text-align:left;border:1px solid var(--hair);background:var(--surface);border-radius:18px;padding:13px 14px;box-shadow:0 1px 2px rgba(12,26,61,.04);color:inherit}
.mcard.hl{border-color:color-mix(in srgb,var(--accent) 40%,transparent);background:color-mix(in srgb,var(--accent) 5%,var(--surface))}
.mtop{display:flex;align-items:center;gap:11px;min-width:0}
.mtt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.mtt b{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mtt span{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mright{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none}
.mright b{font-size:15px;font-weight:800;letter-spacing:-.02em}
.mright small{font-size:11px;color:var(--muted)}
.mthumb{width:48px;height:48px;border-radius:12px;overflow:hidden;flex:none;background:var(--hair)}
.mthumb img,.mthumb svg{width:100%;height:100%;object-fit:cover;display:block}
.mdot{width:12px;height:12px;border-radius:50%;flex:none;margin:0 4px}
.mline{font-size:12.5px;padding-left:2px}.mline span{color:var(--muted)}
.mstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;background:var(--surface-2);border-radius:12px;padding:9px 11px}
.mst{display:flex;flex-direction:column;gap:2px;min-width:0}
.mst span{font-size:10.5px;color:var(--muted);font-weight:600}
.mst b{font-size:14px;font-weight:750;letter-spacing:-.01em}
.mbar{display:block;height:4px;border-radius:99px;background:var(--hair-2);overflow:hidden;margin-top:3px}
.mbar i{display:block;height:100%;border-radius:99px}
.mfoot{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:12px}
.chip-s{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:650;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--hair);border-radius:99px;padding:3px 9px}
.chip-s.date{color:var(--accent-ink);background:var(--accent-soft);border-color:transparent}
.hm-wrap{overflow-x:auto;overscroll-behavior-x:contain;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
.hm-wrap::-webkit-scrollbar{display:none}
.hm{display:grid;width:max-content;row-gap:4px}
.hm-n{position:sticky;left:-16px;z-index:2;background:var(--surface);border:0;text-align:left;font-size:12px;font-weight:650;padding:0 8px 0 0;height:24px;display:flex;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:8px 0 8px -8px rgba(12,26,61,.25);color:var(--ink)}
.hm-h{height:34px;font-size:11px;color:var(--muted)}
.hm-n.hm-h{font-weight:700}
.hm-d{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.hm-d small{font-size:9px;opacity:.75}.hm-d span{font-weight:700;color:var(--ink-2)}
.hm-d.we span,.hm-d.we small{color:var(--accent-ink)}
.hm-d.td span{background:var(--accent);color:#fff;border-radius:7px;padding:0 5px}
.hm-c{display:grid;place-items:center;height:24px}
.hm-c.td{background:var(--accent-soft)}
.hm-c i{width:20px;height:20px;border-radius:6px;background:var(--hair-2);display:block}
.hm-key{display:flex;gap:14px;align-items:center;font-size:11.5px;color:var(--muted);margin-top:8px}
.hm-key i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--hair-2);margin-right:5px;vertical-align:-1px}
.pcard-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}

/* ---------- boards ---------- */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.col{background:var(--surface-2);border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:9px;min-width:0}
.col-h{display:flex;align-items:center;font-size:12.5px;font-weight:700;padding:2px 4px}
.col-h span{margin-left:auto;color:var(--muted);font-weight:600}
.tile{background:var(--surface);border:1px solid var(--hair);border-radius:16px;padding:11px 13px;display:flex;flex-direction:column;gap:6px;min-width:0;box-shadow:0 1px 2px rgba(12,26,61,.04)}
.tile .row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tile .row .end{margin-left:auto}
.tile b{font-size:12.5px;font-weight:700}
.tile .m{font-size:11.5px;color:var(--muted)}

/* ---------- sheet & modal ---------- */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(7,13,31,.36);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.sheet{position:fixed;top:0;right:0;bottom:0;z-index:51;width:min(460px,100%);padding:max(14px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) 14px}
.sheet .in{position:relative;height:100%;border-radius:28px;overflow:auto;background:var(--surface);border:1px solid var(--glass-line);box-shadow:var(--shadow-lg);display:flex;flex-direction:column}
.sheet .img{aspect-ratio:16/10;max-width:100%;flex:none}
.sheet .img svg,.sheet .img img{width:100%;height:100%;display:block;object-fit:cover}
.sheet .body{padding:18px 20px 22px;display:flex;flex-direction:column;gap:14px}
.sheet h2{margin:0;font-family:var(--serif);font-weight:400;font-size:28px;letter-spacing:-.01em}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.kv span{font-size:11.5px;color:var(--muted);display:block}
.kv b{font-size:13.5px;font-weight:650}
.signin-wrap{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:16px;background:var(--bg)}
.signin-card{width:min(380px,100%);padding:34px 28px;border-radius:28px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.signin-card h2{margin:0;font-family:var(--serif);font-weight:400;font-size:28px;line-height:1.1}
.signin-logo{width:64px;height:64px;border-radius:18px}.signin-note{margin:0;color:var(--muted);font-size:13.5px}
.gsi-btn{min-height:44px;display:flex;justify-content:center}
.mg-filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.mg-filters input[type=search]{flex:1 1 240px;min-width:0}.mg-filters select{flex:0 1 auto;max-width:100%}
.mg-batch{position:sticky;top:8px;z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;margin-bottom:10px;border-radius:16px;background:var(--accent-soft);border:1px solid var(--hair)}
.mg-pick{max-width:190px;min-height:40px!important;padding:8px 12px!important;font-size:14px!important;width:auto!important}
.mg-filters select{width:auto!important}.form textarea{resize:vertical;font-family:inherit}.mg-all{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);margin:2px 0 8px}
.mg-list{display:flex;flex-direction:column;gap:8px}
.mg-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--hair);border-radius:16px;background:var(--surface)}
.mg-row.on{border-color:var(--accent)}.mg-row.mg-edit{border-color:var(--warn,#d97706);background:var(--warn-soft)}
.mg-main{display:flex;flex-direction:column;gap:3px;min-width:0}.mg-main>b{font-size:14px}.mg-main>span{font-size:12.5px;color:var(--muted)}
.mg-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px}.mg-note{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mg-acts{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.mg-pending{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));z-index:40;display:flex;gap:10px;align-items:center;padding:10px 12px 10px 16px;border-radius:99px;box-shadow:var(--shadow-lg);max-width:calc(100% - 32px);flex-wrap:wrap}
@media (max-width:640px){
  .mg-pending{left:12px;right:12px;transform:none;max-width:none;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);border-radius:18px;flex-wrap:nowrap;justify-content:space-between;gap:8px;padding:8px 8px 8px 14px;background:var(--surface);-webkit-backdrop-filter:none;backdrop-filter:none;border:1px solid var(--hair-2)}
  .mg-pending>span{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1 1 auto}
  .mg-pending .btn{flex:0 0 auto;white-space:nowrap}

/* No grey holes: when a row of cards doesn't reach the right edge, the last card in it widens to fill. Runs before charts draw, so they draw at the final width. */
function fillRows(g){
  const kids=[...g.children].filter(e=>e.offsetParent!==null);kids.forEach(e=>e.style.gridColumn='');
  const cs=getComputedStyle(g),gap=parseFloat(cs.columnGap)||0,gw=g.clientWidth,col=(gw-gap*11)/12;if(col<=0)return;
  const left=g.getBoundingClientRect().left,rows=new Map();
  kids.forEach(e=>{const r=e.getBoundingClientRect(),k=Math.round(r.top);(rows.get(k)||rows.set(k,[]).get(k)).push([e,r])});
  rows.forEach(list=>{const[e,r]=list.reduce((m,x)=>x[1].right>m[1].right?x:m);const free=Math.round((left+gw-r.right)/(col+gap));
    if(free>0){const span=Math.round((r.width+gap)/(col+gap));e.style.gridColumn=`span ${Math.min(12,span+free)}`}});

/* A long list beside shorter cards takes their height and scrolls inside, instead of stretching the whole row. */
function fitHeights(g){
  const kids=[...g.children];kids.forEach(e=>{if(e.classList.contains('fit')){e.style.height='';e.classList.remove('clip')}});
  if(!kids.some(e=>e.classList.contains('fit')))return;

    list.forEach(([e,hh])=>{{const cap=Math.max(other,340);if(e.classList.contains('fit')&&hh>cap+40)set.push([e,cap])}})});
  g.style.alignItems='';set.forEach(([e,hh])=>{e.style.height=hh+'px';e.classList.add('clip')});
}

<script>
/* Installable app: register the offline helper, offer "Install app" where the browser supports it, and show the
   Add-to-Home-Screen steps on iPhone. Hidden when already running as an installed app. */
(()=>{const box=document.getElementById('installBox'),btn=document.getElementById('installBtn'),note=document.getElementById('installNote');
  const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  if('serviceWorker' in navigator&&isSecureContext)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
  /* Self-update: an app saved to the home screen often resumes an old copy instead of reloading. On every return to
     the app it asks for the deployed version and refreshes when it changed - unless edits or a form are open, then
     it offers the refresh instead. */
  let myBuild=null;const verNow=()=>fetch('version.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>j&&j.build).catch(()=>null);
  verNow().then(b=>{myBuild=b});
  const checkUpdate=async()=>{if(!myBuild||document.hidden)return;const b=await verNow();if(!b||b===myBuild)return;
    try{const reg=await navigator.serviceWorker?.getRegistration();await reg?.update()}catch(e){}
    const lay=document.getElementById('layer'),busy=(typeof window.jgStaged==='function'&&window.jgStaged())||(lay&&lay.children.length);  // this script can't see the app's own helpers
    if(busy&&typeof window.jgToast==='function'){window.jgToast('A new version of the dashboard is ready',()=>location.reload(),'Refresh')}else if(!busy)location.reload()};
  document.addEventListener('visibilitychange',checkUpdate);addEventListener('focus',checkUpdate);addEventListener('pageshow',e=>{if(e.persisted)checkUpdate()});
  if(standalone||!box)return;
  let ask=null;
  addEventListener('beforeinstallprompt',e=>{e.preventDefault();ask=e;box.hidden=false;btn.hidden=false;note.textContent='Adds an icon to your home screen.'});
  btn.addEventListener('click',async()=>{if(!ask)return;ask.prompt();try{await ask.userChoice}catch(e){}ask=null;btn.hidden=true;note.textContent='Installed apps open full screen from your home screen.'});
  addEventListener('appinstalled',()=>{box.hidden=true});
  if(/iphone|ipad|ipod/i.test(navigator.userAgent)){box.hidden=false;note.textContent='On iPhone: tap Share, then “Add to Home Screen”.'}})();
</script>
